# Entorno PROD. Mismos servicios que QA, otro proyecto de Compose.
# Puertos del host distintos: 8081 la API, 3001 el front. El lado del
# contenedor no cambia: adentro el backend sigue en 4177 y nginx en 80.

name: prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/agustindt/facultad-hub-backend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hub:${DB_PASSWORD}@db:5432/hub
      VAULT_DIR: /vault
      DATA_DIR: /app/datos
      HOST: 0.0.0.0
      PORT: 4177
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${IMAGE_TAG:-}
    volumes:
      - vault:/vault
      - datos-hub:/app/datos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:4177"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4177/api/vivo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    image: ghcr.io/agustindt/facultad-hub-frontend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4177
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  datos-db:
    name: db_data_prod
  datos-hub:
    name: datos_hub_prod
  vault:
    name: vault_prod
