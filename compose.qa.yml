# Entorno QA. Lo levanta el job deploy-qa, no una persona.
#
# `name: qa` es el aislamiento: sin esto Compose usa el directorio como
# proyecto y el deploy de PROD recrea los contenedores de QA.
# Los volúmenes llevan nombre propio por lo mismo: cada entorno, su base.

name: qa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    image: ghcr.io/agustindt/facultad-hub-backend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hub:${DB_PASSWORD}@db:5432/hub
      VAULT_DIR: /vault
      DATA_DIR: /app/datos
      HOST: 0.0.0.0
      PORT: 4177
    volumes:
      - vault:/vault
      - datos-hub:/app/datos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:4177"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4177/api/vivo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    image: ghcr.io/agustindt/facultad-hub-frontend:${IMAGE_TAG:?falta IMAGE_TAG}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4177
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  datos-db:
    name: db_data_qa
  datos-hub:
    name: datos_hub_qa
  vault:
    name: vault_qa
