name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Tests y umbral de cobertura del backend
        working-directory: backend
        run: |
          set -o pipefail
          npm ci
          set +e
          npm test | tee /tmp/backend-test.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Cobertura backend"
            echo '```'
            tail -n 16 /tmp/backend-test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publicar el reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          # v7 adjunta una atestación por defecto. ghcr la rechazó con
          # write_package aunque el token tenía Packages: write. Sin esto
          # el manifest no entra y el tag no existe.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests y umbral de cobertura del frontend
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci
          set +e
          npm test | tee /tmp/frontend-test.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Cobertura frontend"
            echo '```'
            tail -n 20 /tmp/frontend-test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publicar el reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Plan C de la cátedra: esta máquina es el runner. QA sube solo después
  # de que las dos imágenes verificaron. PROD espera un reviewer.
  deploy-qa:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: qa
      url: http://localhost:3000
    permissions:
      contents: read
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Levantar QA con la imagen de esta corrida
        shell: bash
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "IMAGE_TAG=$IMAGE_TAG"
          docker compose -f compose.qa.yml pull
          docker compose -f compose.qa.yml up -d --wait

      - name: Smoke test
        shell: bash
        env:
          URL_API: http://localhost:8080
          URL_FRONT: http://localhost:3000
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/vivo" -o /tmp/vivo.json \
               && python3 -c 'import json; d=json.load(open("/tmp/vivo.json")); assert d["ok"] and d["almacen"]["ok"] and d["almacen"]["modo"]=="postgres"' \
               && curl -fsS --max-time 10 "$URL_FRONT/" -o /dev/null; then
              echo "QA responde (API + base + front), intento $i"
              exit 0
            fi
            echo "intento $i: todavía no"
            sleep 10
          done
          echo "QA no respondió a tiempo"
          exit 1

  integracion:
    runs-on: self-hosted
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar, sin navegador
        working-directory: frontend
        run: npm ci

      - name: Integración contra la api de QA
        working-directory: frontend
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          set +e
          npx playwright test e2e/api.spec.js --reporter=list --reporter=html | tee /tmp/integracion.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Integración"
            echo '```'
            tail -n 30 /tmp/integracion.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publicar el reporte de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integracion-report
          path: frontend/playwright-report

  e2e:
    runs-on: self-hosted
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: e2e contra el front de QA
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          set +e
          npx playwright test e2e/calendario.spec.js --reporter=list --reporter=html | tee /tmp/e2e.txt
          status=${PIPESTATUS[0]}
          {
            echo "### e2e"
            echo '```'
            tail -n 30 /tmp/e2e.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publicar el reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/playwright-report

  deploy-prod:
    runs-on: self-hosted
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://localhost:3001
    permissions:
      contents: read
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Levantar PROD con la misma imagen
        shell: bash
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "IMAGE_TAG=$IMAGE_TAG"
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d --wait

      - name: Smoke test
        shell: bash
        env:
          URL_API: http://localhost:8081
          URL_FRONT: http://localhost:3001
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/vivo" -o /tmp/vivo-prod.json \
               && python3 -c 'import json; d=json.load(open("/tmp/vivo-prod.json")); assert d["ok"] and d["almacen"]["ok"] and d["almacen"]["modo"]=="postgres"' \
               && curl -fsS --max-time 10 "$URL_FRONT/" -o /dev/null; then
              echo "PROD responde (API + base + front), intento $i"
              exit 0
            fi
            echo "intento $i: todavía no"
            sleep 10
          done
          echo "PROD no respondió a tiempo"
          exit 1
