<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Facultad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
/* =========================================================================
   Tokens. Paleta validada con el validador de dataviz:
   - categórica (identidad de materia): violeta / teal / ámbar
   - ordinal (estado de estudio): rampa azul de un solo tono, light→dark
   - status: fija, nunca se reutiliza como serie
   ========================================================================= */
:root {
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --surface-2:#ffffff;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  --m1:#6247d4; --m2:#00908a; --m3:#9c6a00; --m4:#b83a6b; --m5:#006300; --m0:#898781;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#184f95;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.06);
  --r:12px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --surface-2:#212120;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --m1:#8b7ff0; --m2:#12a596; --m3:#c28400; --m4:#d55181; --m5:#008300; --m0:#898781;
  --o1:#184f95; --o2:#256abf; --o3:#3987e5; --o4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--plane); color:var(--ink-1);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in oklab,var(--m1) 30%,transparent)}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{
  background:var(--surface-1);border-right:1px solid var(--hair);
  padding:18px 12px;display:flex;flex-direction:column;gap:14px;
  /* Fijo al scrollear. Dos condiciones que hay que cumplir juntas:
     - align-self:start, porque un item de grid se estira a la altura de la fila
       por defecto y entonces no le queda recorrido para pegarse.
     - height:100vh sin min-height, para que mida la ventana y no el documento.
     Con min-height:100% medía 2949px en una nota larga y se iba con el scroll. */
  position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  overscroll-behavior:contain;
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--grid);border-radius:3px}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:650;letter-spacing:-.01em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--m1)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{
  display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;
  color:var(--ink-2);font-size:14px;transition:background .12s,color .12s;
}
nav a:hover{background:color-mix(in oklab,var(--ink-1) 5%,transparent);color:var(--ink-1)}
nav a.on{background:color-mix(in oklab,var(--m1) 14%,transparent);color:var(--ink-1);font-weight:550}
nav a .ico{width:17px;text-align:center;opacity:.85;font-size:13px}
nav .sep{margin:9px 10px 3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--ink-3);line-height:1.5}
main{padding:28px 34px 72px;max-width:1240px;width:100%}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  nav{flex-direction:row;flex-wrap:wrap}
  nav .sep,.side-foot{display:none}
  main{padding:20px 16px 60px}
}

/* ---------- Encabezados ---------- */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--ink-2);font-size:14px;margin-top:3px}
h2{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
h3{font-size:14px;font-weight:600;margin-bottom:8px}

/* ---------- Piezas ---------- */
.card{background:var(--surface-1);border:1px solid var(--hair);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--ink-3)}
.sec{color:var(--ink-2)}
.tiny{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

.btn{
  background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;transition:background .12s,border-color .12s;
}
.btn:hover{background:color-mix(in oklab,var(--ink-1) 6%,var(--surface-2))}
.btn.primary{background:var(--m1);border-color:transparent;color:#fff;font-weight:550}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.input{
  background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;
  padding:7px 11px;font-size:13.5px;width:100%;
}
.input:focus{outline:2px solid color-mix(in oklab,var(--m1) 55%,transparent);outline-offset:-1px}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:12px;background:color-mix(in oklab,var(--ink-1) 6%,transparent);color:var(--ink-2);
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
}
.chip.on{background:color-mix(in oklab,var(--m1) 16%,transparent);color:var(--ink-1);border-color:color-mix(in oklab,var(--m1) 30%,transparent)}
.swatch{width:9px;height:9px;border-radius:2.5px;flex:none}
.dotk{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- Stat tiles ---------- */
.tile{background:var(--surface-1);border:1px solid var(--hair);border-radius:var(--r);padding:16px 18px}
.tile .lbl{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.tile .val{font-size:28px;font-weight:640;letter-spacing:-.02em;line-height:1.1}
.tile .note{font-size:12px;color:var(--ink-3);margin-top:5px}
.hero{font-size:56px;font-weight:660;letter-spacing:-.03em;line-height:1}
.hero-unit{font-size:17px;font-weight:500;color:var(--ink-2);margin-left:7px;letter-spacing:0}

/* ---------- Barra apilada de estado ---------- */
.stack{display:flex;height:14px;border-radius:4px;overflow:visible;gap:2px}
.stack > i{display:block;height:100%;min-width:3px}
.stack > i:first-child{border-radius:4px 0 0 4px}
.stack > i:last-child{border-radius:0 4px 4px 0}
.stack > i:only-child{border-radius:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Meter ---------- */
.meter{height:6px;border-radius:3px;background:color-mix(in oklab,var(--o1) 35%,var(--surface-1));overflow:hidden}
.meter > i{display:block;height:100%;border-radius:3px;background:var(--o3)}

/* ---------- Tablas ---------- */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;letter-spacing:.02em;
   text-transform:uppercase;padding:0 10px 8px;border-bottom:1px solid var(--grid)}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in oklab,var(--ink-1) 3%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Lista de notas ---------- */
.note-row{
  display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 13px;border-radius:10px;
  border:1px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;
}
.note-row:hover{background:var(--surface-1);border-color:var(--hair)}
.note-row .t{font-weight:530;letter-spacing:-.005em}
.note-row .x{font-size:12.5px;color:var(--ink-3);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--grid);border:1px solid var(--grid);border-radius:10px;overflow:hidden}
.cal .dow{background:var(--surface-1);padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.cal .day{background:var(--surface-1);min-height:96px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--plane)}
.cal .day .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cal .day.today .n{background:var(--m1);color:#fff;border-radius:50%;width:20px;height:20px;
  display:grid;place-items:center;font-weight:600}
.ev{font-size:11.5px;padding:3px 6px;border-radius:5px;line-height:1.3;cursor:pointer;
  display:flex;gap:5px;align-items:flex-start;background:color-mix(in oklab,var(--ink-1) 6%,transparent)}
.ev .k{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:12px}

/* ---------- Nota / editor ---------- */
.prose{max-width:74ch;font-size:15.5px;line-height:1.68}
.prose h1{font-size:26px;margin:0 0 14px}
.prose h2{font-size:19px;margin:30px 0 10px;letter-spacing:-.01em}
.prose h3{font-size:16px;margin:22px 0 8px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px 22px}
.prose li{margin-bottom:5px}
.prose blockquote{border-left:2.5px solid var(--m1);padding:2px 0 2px 15px;margin:0 0 16px;color:var(--ink-2)}
.prose table{margin:0 0 18px}
.prose code{background:color-mix(in oklab,var(--ink-1) 7%,transparent);padding:1.5px 5px;border-radius:4px;font-size:.88em}
.prose pre{background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;padding:13px;overflow-x:auto;margin:0 0 16px}
.prose pre code{background:none;padding:0}
.prose hr{border:none;border-top:1px solid var(--grid);margin:26px 0}
.wl{color:var(--m1);border-bottom:1px solid color-mix(in oklab,var(--m1) 35%,transparent)}
.wl.broken{color:var(--crit);border-bottom-style:dashed}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:calc(100vh - 210px)}
.editor textarea{
  width:100%;height:100%;resize:none;background:var(--surface-1);border:1px solid var(--hair);
  border-radius:var(--r);padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px;line-height:1.65;
}
.editor .prev{background:var(--surface-1);border:1px solid var(--hair);border-radius:var(--r);
  padding:18px 22px;overflow-y:auto}
@media(max-width:900px){.editor{grid-template-columns:1fr;height:auto}.editor textarea{height:52vh}}

/* ---------- Grafo ---------- */
#graph{width:100%;height:calc(100vh - 240px);min-height:420px;background:var(--surface-1);
  border:1px solid var(--hair);border-radius:var(--r)}
#graph circle{cursor:pointer}
#graph text{font-size:9.5px;fill:var(--ink-2);pointer-events:none}

/* ---------- Tooltip ---------- */
#tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;
  padding:9px 12px;font-size:12.5px;box-shadow:var(--shadow);max-width:280px;line-height:1.45;
}
#tip.on{opacity:1}

/* ---------- Paleta de comandos ---------- */
#omni{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:100;
  align-items:flex-start;justify-content:center;padding-top:14vh}
#omni.on{display:flex}
#omni .box{width:min(620px,92vw);background:var(--surface-1);border:1px solid var(--hair);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#omni input{width:100%;border:none;background:none;padding:16px 18px;font-size:16px;outline:none}
#omni .res{max-height:52vh;overflow-y:auto;border-top:1px solid var(--grid)}
#omni .r{padding:10px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
#omni .r.sel,#omni .r:hover{background:color-mix(in oklab,var(--m1) 13%,transparent)}


/* ---------- Panel del asistente (columna derecha) ---------- */
#app{transition:grid-template-columns .16s ease}
body.con-panel #app{grid-template-columns:232px minmax(0,1fr) 400px}
#panel{display:none}
body.con-panel #panel{
  display:flex;flex-direction:column;background:var(--surface-1);
  border-left:1px solid var(--hair);
  position:sticky;top:0;align-self:start;height:100vh;overflow:hidden;
}
.pan-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--hair);flex:none}
.pan-modo{display:flex;gap:5px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--hair);flex:none}
.pan-cuerpo{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px;font-size:14px}
.pan-pie{flex:none;padding:12px 16px;border-top:1px solid var(--hair);background:var(--surface-1)}
.pan-input{width:100%;height:66px;resize:none;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.5;margin-top:7px}
.pan-input:focus{outline:2px solid color-mix(in oklab,var(--m1) 50%,transparent);outline-offset:-1px}
.pan-sug{padding:9px 11px;border-radius:9px;border:1px solid var(--hair);background:var(--surface-2);
  font-size:13px;color:var(--ink-2);cursor:pointer;margin-top:7px;line-height:1.45}
.pan-sug:hover{border-color:color-mix(in oklab,var(--m1) 45%,transparent);color:var(--ink-1)}
.pan-cuerpo .prose{font-size:13.5px;max-width:none}
.pan-cuerpo .card{padding:12px}
.pan-fab{position:fixed;right:20px;bottom:20px;z-index:60;border-radius:999px;padding:11px 17px;
  background:var(--m1);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:550;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.pan-fab:hover{filter:brightness(1.08)}
body.con-panel .pan-fab{display:none}
body.foco .pan-fab{display:none}
@media(max-width:1200px){
  body.con-panel #app{grid-template-columns:232px minmax(0,1fr)}
  body.con-panel #panel{position:fixed;right:0;top:0;width:min(400px,92vw);z-index:70;box-shadow:var(--shadow)}
}
@media(max-width:900px){ body.con-panel #app{grid-template-columns:1fr} }

/* ---------- Captura rápida (modo foco) ---------- */
body.foco aside{display:none}
body.foco #app{grid-template-columns:1fr}
body.foco main{padding:0;max-width:none;display:flex;flex-direction:column;height:100vh}
.cap-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 22px;border-bottom:1px solid var(--hair);background:var(--surface-1);flex:none}
.cap-ta{flex:1;width:100%;max-width:none;resize:none;border:none;outline:none;background:var(--plane);
  padding:34px max(24px,calc(50% - 37ch));font-size:16.5px;line-height:1.75;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
.cap-pie{display:flex;justify-content:space-between;gap:12px;padding:9px 22px;
  border-top:1px solid var(--hair);background:var(--surface-1);flex:none}
@media(max-width:900px){.cap-ta{padding:20px 16px}}

/* ---------- Columna lateral fija (backlinks) ----------
   Mismo par de condiciones que el menú: align-self:start para que el item de
   grid no se estire a la altura de la fila, y una altura acotada a la ventana
   con su propio scroll, porque la lista de backlinks puede ser más larga que
   la pantalla y si no el final queda inalcanzable. */
.side-fijo{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);
  overflow-y:auto;overscroll-behavior:contain}
.side-fijo::-webkit-scrollbar{width:6px}
.side-fijo::-webkit-scrollbar-thumb{background:var(--grid);border-radius:3px}
@media(max-width:900px){.side-fijo{position:static;max-height:none}}

/* ---------- Matriz de actividad ----------
   Rampa secuencial de un solo tono. Los pasos salieron del validador de dataviz
   contra las dos superficies reales del hub (#fcfcfb y #1a1a19): L monótona,
   saltos >= 0.06, y el paso más claro despega de la superficie — 2.00:1 en claro,
   2.12:1 en oscuro. El nivel 0 es el gris de grilla, no un verde desvaído.
*/
:root{ --gh1:#81c57b; --gh2:#61b55c; --gh3:#399f34; --gh4:#036702; }
:root[data-theme="dark"]{ --gh1:#105c0e; --gh2:#239220; --gh3:#4bad45; --gh4:#74c76e; }
.gh-wrap{overflow-x:auto;padding-bottom:4px}
.gh-cuerpo{display:flex;gap:6px;align-items:flex-start}
.gh-dows{display:grid;grid-template-rows:repeat(7,13px);font-size:9.5px;color:var(--ink-3);
  width:26px;text-align:right;line-height:11px}
.gh-grid{display:grid;grid-auto-rows:13px}
.gh-meses{display:grid;font-size:9.5px;color:var(--ink-3);margin:0 0 3px 32px;height:12px}
.gh-cel{display:block;width:11px;height:11px;border-radius:2.5px;background:var(--grid);cursor:default}
.gh-cel[data-n="1"]{background:var(--gh1)}
.gh-cel[data-n="2"]{background:var(--gh2)}
.gh-cel[data-n="3"]{background:var(--gh3)}
.gh-cel[data-n="4"]{background:var(--gh4)}
.gh-cel:hover{outline:1.5px solid var(--ink-2);outline-offset:1px}

/* ---------- Zona de arrastre ---------- */
.dropzone{border:1.5px dashed var(--axis);border-radius:var(--r);padding:34px 20px;text-align:center;
  color:var(--ink-3);font-size:13.5px;cursor:pointer;transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.hover{border-color:var(--m1);background:color-mix(in oklab,var(--m1) 7%,transparent);color:var(--ink-2)}
.dropzone.lleno{border-style:solid;border-color:color-mix(in oklab,var(--good) 50%,transparent);color:var(--ink-1)}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.badge{font-size:11px;padding:2px 7px;border-radius:5px;background:color-mix(in oklab,var(--ink-1) 7%,transparent);color:var(--ink-2)}
.alert{border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:color-mix(in oklab,var(--crit) 12%,transparent);border:1px solid color-mix(in oklab,var(--crit) 30%,transparent)}
.alert.warn{background:color-mix(in oklab,var(--warn) 14%,transparent);border:1px solid color-mix(in oklab,var(--warn) 34%,transparent)}
.alert.ok{background:color-mix(in oklab,var(--good) 12%,transparent);border:1px solid color-mix(in oklab,var(--good) 30%,transparent)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span> Hub Facultad</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div><kbd>⌘K</kbd> buscar · <kbd>⌘J</kbd> asistente</div>
      <div id="foot-count" style="margin-top:6px"></div>
    </div>
  </aside>
  <main id="main"><div class="empty">Cargando…</div></main>
  <div id="panel"></div>
</div>
<button class="pan-fab" id="fab">✦ Asistente <span style="opacity:.7;font-size:12px">⌘J</span></button>

<div id="tip"></div>
<div id="omni"><div class="box">
  <input id="omni-q" placeholder="Buscá una palabra: busca en el texto de todas las notas…" autocomplete="off">
  <div id="omni-modo" class="tiny" style="display:none;padding:8px 18px;border-top:1px solid var(--grid);background:color-mix(in oklab,var(--m1) 10%,transparent);color:var(--ink-2)"></div>
  <div class="res" id="omni-res"></div>
</div></div>

<!-- Todo local: el hub funciona sin internet. -->
<script src="/vendor/marked.js"></script>
<script src="/vendor/d3.js"></script>
<script src="/vendor/mermaid.js"></script>
<link rel="stylesheet" href="/vendor/katex.css">
<script src="/vendor/katex.js"></script>
<script src="/vendor/katex-auto.js"></script>

<script>
'use strict';

/* =========================================================================
   Estado y utilidades
   ========================================================================= */
const S = { data:null, salud:null, grafo:null, view:'hub', params:{} };
const ESTADOS = ['pendiente','borrador','estudiado','dominado'];
const ESTADO_LBL = {pendiente:'Pendiente',borrador:'Borrador',estudiado:'Estudiado',dominado:'Dominado'};
const ORD = ['--o1','--o2','--o3','--o4'];
const MAT_SLOT = ['--m0','--m1','--m2','--m3','--m4','--m5'];
const SLOT_LBL = ['Gris (sin color)','Violeta','Verde azulado','Ámbar','Magenta','Verde'];
const TIPO_LBL = {concepto:'Concepto',unidad:'Unidad',tp:'TP',entrega:'Entrega',clase:'Clase',
  moc:'MOC',seguimiento:'Seguimiento',sistema:'Sistema'};
const EV_COLOR = {examen:'--crit',recuperatorio:'--serious',entrega:'--m1',defensa:'--m2',
  hito:'--ink-3',feriado:'--ink-3'};

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const HOY = new Date(); HOY.setHours(0,0,0,0);
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setHours(0,0,0,0); return dt; };
const dias = iso => Math.round((parseISO(iso)-HOY)/86400000);
const fmtFecha = iso => parseISO(iso).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
const fmtLargo = iso => parseISO(iso).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

function matColor(id){
  const m = (S.data?.materias||[]).find(x=>x.id===id);
  const s = m ? Math.max(0,Math.min(m.slot, MAT_SLOT.length-1)) : 0;
  return cssv(MAT_SLOT[s]);
}

async function api(p,o){ const r = await fetch(p,o); if(!r.ok) throw new Error((await r.json()).error||r.statusText); return r.json(); }

/* ---------- Tooltip ---------- */
const tip = $('#tip');
function showTip(e,html){ tip.innerHTML=html; tip.classList.add('on');
  const r=tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX+14, innerWidth-r.width-12)+'px';
  tip.style.top  = Math.min(e.clientY+14, innerHeight-r.height-12)+'px'; }
function hideTip(){ tip.classList.remove('on'); }
function bindTip(node,html){
  node.addEventListener('mousemove',e=>showTip(e,html));
  node.addEventListener('mouseleave',hideTip);
  node.tabIndex=0;
  node.addEventListener('focus',e=>{const r=node.getBoundingClientRect();
    showTip({clientX:r.left,clientY:r.bottom},html)});
  node.addEventListener('blur',hideTip);
}

/* =========================================================================
   Markdown
   ========================================================================= */
function stemsSet(){ return new Set((S.data?.notas||[]).map(n=>n.stem)); }
function relForStem(stem){ const n=(S.data?.notas||[]).find(x=>x.stem===stem); return n?n.rel:null; }

function renderMd(src){
  const stems = stemsSet();
  // Protege los bloques de código antes de tocar los wikilinks.
  const blocks=[];
  let s = src.replace(/```[\s\S]*?```/g, m=>{blocks.push(m); return `␀${blocks.length-1}␀`;});
  s = s.replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g,(m,target,label)=>{
    const t=target.trim(); const txt=(label||t).trim();
    const rel=relForStem(t);
    return rel ? `<a class="wl" href="#/nota?rel=${encodeURIComponent(rel)}">${esc(txt)}</a>`
               : `<span class="wl broken" title="Wikilink roto: no existe una nota con ese nombre">${esc(txt)}</span>`;
  });
  s = s.replace(/␀(\d+)␀/g,(m,i)=>blocks[+i]);
  let html = marked.parse(s,{breaks:false,gfm:true});
  return html;
}

function enhance(root){
  // Mermaid
  root.querySelectorAll('pre code.language-mermaid').forEach((c,i)=>{
    const div=el('div','mermaid'); div.textContent=c.textContent;
    c.closest('pre').replaceWith(div);
  });
  if(window.mermaid){
    try{
      window.mermaid.initialize({startOnLoad:false,theme:document.documentElement.dataset.theme==='dark'?'dark':'default',
        securityLevel:'loose', fontFamily:'system-ui,-apple-system,sans-serif'});
      window.mermaid.run({nodes:root.querySelectorAll('.mermaid')});
    }catch(e){}
  }
  // LaTeX
  if(window.renderMathInElement){
    try{ window.renderMathInElement(root,{delimiters:[
      {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }catch(e){}
  }
}

/* =========================================================================
   Barra de inserción: los símbolos y bloques a mano
   ========================================================================= */

/** Inserta alrededor de la selección (o del placeholder si no hay selección). */
function envolver(ta, antes, despues='', placeholder=''){
  const s=ta.selectionStart, e=ta.selectionEnd;
  const hay=e>s;
  const sel=hay?ta.value.slice(s,e):placeholder;
  ta.value=ta.value.slice(0,s)+antes+sel+despues+ta.value.slice(e);
  ta.selectionStart=s+antes.length;
  ta.selectionEnd=s+antes.length+sel.length;
  ta.focus(); ta.dispatchEvent(new Event('input'));
}

/** Inserta un bloque en su propia línea, respetando lo que ya había. */
function bloque(ta, texto){
  const s=ta.selectionStart;
  const antes=ta.value.slice(0,s);
  const pre=(antes==='' || antes.endsWith('\n\n')) ? '' : (antes.endsWith('\n') ? '\n' : '\n\n');
  const ins=pre+texto+'\n';
  ta.value=antes+ins+ta.value.slice(ta.selectionEnd);
  const pos=s+ins.length;
  ta.selectionStart=ta.selectionEnd=pos;
  ta.focus(); ta.dispatchEvent(new Event('input'));
}

const TABLA = `| Columna | Columna | Columna |\n|---|---|---|\n|  |  |  |\n|  |  |  |`;

// Los diagramas salen con la paleta fija de Convenciones.md y con <b>/<br/>,
// porque dentro de un nodo de Mermaid la negrita con asteriscos no se interpreta.
const MERMAID_FLOW = '```mermaid\nflowchart LR\n    A["<b>Concepto</b><br/>entrada"] --> B["Resultado"]\n    style A fill:#4DB6AC,color:#fff\n    style B fill:#7C5CFF,color:#fff\n```';
const MERMAID_QUAD = '```mermaid\nquadrantChart\n    title Título de la matriz\n    x-axis "Bajo" --> "Alto"\n    y-axis "Bajo" --> "Alto"\n    quadrant-1 "Arriba derecha"\n    quadrant-2 "Arriba izquierda"\n    quadrant-3 "Abajo izquierda"\n    quadrant-4 "Abajo derecha"\n```';
const MERMAID_MIND = '```mermaid\nmindmap\n  root((TEMA))\n    RAMA UNO\n      hoja\n      hoja\n    RAMA DOS\n      hoja\n```';
const CONEXIONES = `## Conexiones\n\n- [[]] — por qué se conectan\n- [[]] — por qué se conectan\n- [[]] — por qué se conectan`;
const EN_PARCIAL = `## En el parcial\n\n`;
const MARCA_CAPTURA = '<!-- captura rápida';

const SIMBOLOS = [
  ['Flechas','→ ← ↑ ↓ ↔ ⇒ ⟺ ↦'],
  ['Comparación','≈ ≠ ≤ ≥ ± ∓ ≡ ∝'],
  ['Operadores','× ÷ · ∑ ∏ √ ∫ ∂'],
  ['Griegas','Δ α β γ δ λ μ π σ ω θ ρ ε'],
  ['Conjuntos','∈ ∉ ⊂ ⊆ ∪ ∩ ∅ ∞'],
  ['Índices','₀ ₁ ₂ ₙ ⁰ ¹ ² ³ ⁿ'],
  ['Marcas','⚠️ 📌 🔑 ✅ ❌ 🚩 ✔ ✗ — · « »'],
];

function barraDeInsercion(ta){
  const barra=el('div','card');
  barra.style.cssText='padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px';

  const fila=el('div','row'); fila.style.gap='4px';
  const sep=()=>{const s=el('span'); s.style.cssText='width:1px;align-self:stretch;background:var(--grid);margin:0 4px'; return s;};
  const btn=(txt,titulo,fn)=>{
    const b=el('button','btn sm',txt); b.title=titulo;
    b.style.cssText='min-width:32px;font-family:ui-monospace,Menlo,monospace';
    b.onmousedown=e=>e.preventDefault();
    b.onclick=fn; return b;
  };

  fila.append(
    btn('[[ ]]','Wikilink a otra nota — después escribí y te autocompleta',
      ()=>envolver(ta,'[[',']]','')),
    btn('B','Negrita',()=>envolver(ta,'**','**','texto')),
    btn('i','Cursiva',()=>envolver(ta,'*','*','texto')),
    btn('`','Código en línea',()=>envolver(ta,'`','`','código')),
    sep(),
    btn('H2','Título de sección',()=>bloque(ta,'## Título')),
    btn('H3','Subtítulo',()=>bloque(ta,'### Subtítulo')),
    btn('Cita','Cita o definición destacada',()=>bloque(ta,'> ')),
    btn('•','Lista',()=>bloque(ta,'- ')),
    btn('1.','Lista numerada',()=>bloque(ta,'1. ')),
    btn('☑','Checklist',()=>bloque(ta,'- [ ] ')),
    sep(),
    btn('Tabla','Tabla de 3 columnas',()=>bloque(ta,TABLA)),
    btn('Código','Bloque de código',()=>bloque(ta,'```\n\n```')),
    btn('$x$','Fórmula en línea (LaTeX)',()=>envolver(ta,'$','$','x = y')),
    btn('$$','Fórmula en bloque (LaTeX)',()=>bloque(ta,'$$\n\n$$')),
    sep(),
    btn('Flow','Diagrama Mermaid: flowchart, ya con tu paleta',()=>bloque(ta,MERMAID_FLOW)),
    btn('2×2','Diagrama Mermaid: matriz de cuadrantes',()=>bloque(ta,MERMAID_QUAD)),
    btn('Mapa','Diagrama Mermaid: mindmap',()=>bloque(ta,MERMAID_MIND)),
    sep(),
    btn('⚠️','Bloque de aviso',()=>bloque(ta,'> ⚠️ ')),
    btn('📌','Nota al margen',()=>bloque(ta,'> 📌 ')),
    sep(),
    btn('Conexiones','Bloque ## Conexiones con 3 enlaces vacíos',()=>bloque(ta,CONEXIONES)),
    btn('En el parcial','Bloque ## En el parcial',()=>bloque(ta,EN_PARCIAL))
  );
  // Los que llevan palabra en vez de símbolo van con la tipografía de la interfaz.
  [...fila.children].forEach(b=>{
    if(b.tagName==='BUTTON' && /[A-Za-zÁÉÍÓÚáéíóú]{3,}/.test(b.textContent))
      b.style.fontFamily='inherit';
  });
  barra.append(fila);

  // Segunda fila: los símbolos sueltos, plegada por defecto.
  const toggle=el('button','btn sm','Símbolos ▾');
  toggle.style.alignSelf='flex-start'; toggle.onmousedown=e=>e.preventDefault();
  const grid=el('div'); grid.style.display='none';
  SIMBOLOS.forEach(([nombre,chars])=>{
    const f=el('div','row'); f.style.cssText='gap:3px;margin-top:6px;align-items:center';
    const et=el('span','tiny muted',nombre); et.style.cssText='width:96px;flex:none';
    f.append(et);
    chars.split(' ').forEach(ch=>{
      const b=el('button','btn sm',ch);
      b.style.cssText='min-width:30px;font-size:14px';
      b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>envolver(ta,ch,'','');
      f.append(b);
    });
    grid.append(f);
  });
  toggle.onclick=()=>{
    const abierto=grid.style.display!=='none';
    grid.style.display=abierto?'none':'block';
    toggle.textContent=abierto?'Símbolos ▾':'Símbolos ▴';
  };
  barra.append(toggle,grid);
  return barra;
}

/** Barra apilada del estado de estudio. Rampa ordinal de un tono + leyenda. */
function stackEstado(conteo,{legend=true}={}){
  const wrap = el('div');
  const total = ESTADOS.reduce((a,k)=>a+(conteo[k]||0),0) + (conteo.sinEstado||0);
  const bar = el('div','stack');
  if(!total){ bar.append(el('i','',''), ); bar.style.background='var(--grid)'; }
  ESTADOS.forEach((k,i)=>{
    const v=conteo[k]||0; if(!v) return;
    const seg=el('i'); seg.style.width=(v/total*100)+'%'; seg.style.background=`var(${ORD[i]})`;
    bindTip(seg,`<b>${ESTADO_LBL[k]}</b><br>${v} de ${total} notas (${Math.round(v/total*100)}%)`);
    bar.append(seg);
  });
  if(conteo.sinEstado){
    const seg=el('i'); seg.style.width=(conteo.sinEstado/total*100)+'%';
    seg.style.background='var(--grid)';
    bindTip(seg,`<b>Sin estado</b><br>${conteo.sinEstado} de ${total} notas`);
    bar.append(seg);
  }
  wrap.append(bar);
  if(legend){
    const lg=el('div','legend');
    ESTADOS.forEach((k,i)=>{
      if(!conteo[k]) return;
      lg.append(el('span','',`<i class="swatch" style="background:var(${ORD[i]})"></i>${ESTADO_LBL[k]} <b style="color:var(--ink-1)">${conteo[k]}</b>`));
    });
    if(conteo.sinEstado) lg.append(el('span','',`<i class="swatch" style="background:var(--grid)"></i>Sin estado <b style="color:var(--ink-1)">${conteo.sinEstado}</b>`));
    wrap.append(lg);
  }
  return wrap;
}

function tile(lbl,val,note,cls){
  const t=el('div','tile');
  t.append(el('div','lbl',esc(lbl)));
  t.append(el('div','val'+(cls?' '+cls:''),val));
  if(note) t.append(el('div','note',note));
  return t;
}

/* =========================================================================
   Vistas
   ========================================================================= */

function proximos(n=6){
  return (S.data?.eventos||[])
    .filter(e=>e.tipo!=='feriado' && dias(e.fecha)>=0)
    .slice(0,n);
}

function viewHub(){
  const m=$('#main'); m.innerHTML='';
  const evs = proximos(50);
  const next = evs[0];

  const head=el('div','head');
  head.append(el('div','',`<h1>Hola, Agustín</h1><div class="sub">${
    S.data.materias.filter(x=>!x.archivada).length} materias · ${S.data.notas.length} notas · ${
    new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>`));
  const acc=el('div','row');
  const bCap=el('button','btn','✎ Capturar'); bCap.onclick=()=>go('#/capturar');
  const bNew=el('button','btn primary','+ Nueva nota'); bNew.onclick=()=>go('#/nueva');
  const bIcs=el('a','btn','Exportar calendario'); bIcs.href='/api/calendario.ics';
  acc.append(bCap,bNew,bIcs); head.append(acc); m.append(head);

  // Repaso de hoy. Se pide aparte para no frenar el resto del hub si tarda.
  const franja=el('div'); franja.style.marginBottom='16px'; m.append(franja);
  api('/api/repaso').then(R=>{
    if(!R.resumen.totalTarjetas) return;
    const c=el('div','card');
    const sp=el('div','spread');
    const izq=el('div');
    if(R.resumen.pendientes){
      izq.append(el('div','',`<b>${R.resumen.pendientes} tarjetas para repasar hoy</b>`));
      const det=R.plan.filter(p=>p.dias!=null).map(p=>`${p.materia} en ${p.dias} días`).join(' · ');
      izq.append(el('div','tiny muted',det||`${R.resumen.totalTarjetas} tarjetas en total`));
    }else{
      izq.append(el('div','',`<b>Repaso al día</b>`));
      izq.append(el('div','tiny muted',
        R.resumen.hechasHoy?`${R.resumen.hechasHoy} tarjetas hechas hoy`:'Nada pendiente'));
    }
    sp.append(izq);
    const b=el('button','btn'+(R.resumen.pendientes?' primary':''),
      R.resumen.pendientes?'Empezar':'Ver el plan');
    b.onclick=()=>go('#/repaso');
    sp.append(b); c.append(sp);
    franja.append(c);
  }).catch(()=>{});

  // Hero: una sola por vista.
  const top=el('div','grid g3'); top.style.marginBottom='16px';
  const heroCard=el('div','tile');
  if(next){
    const d=dias(next.fecha);
    heroCard.append(el('div','lbl','Próximo hito'));
    heroCard.append(el('div','',`<span class="hero">${d===0?'Hoy':d}</span>${
      d===0?'':`<span class="hero-unit">${d===1?'día':'días'}</span>`}`));
    heroCard.append(el('div','note',`${esc(next.titulo)} · ${fmtLargo(next.fecha)}`));
  } else {
    heroCard.append(el('div','lbl','Próximo hito'));
    heroCard.append(el('div','',`<span class="hero">—</span>`));
    heroCard.append(el('div','note','No hay fechas futuras cargadas'));
  }
  top.append(heroCard);

  const conceptos=S.data.notas.filter(n=>n.tipo==='concepto');
  const dominados=conceptos.filter(n=>n.estado==='dominado'||n.estado==='estudiado').length;
  top.append(tile('Conceptos atomizados', conceptos.length,
    `${dominados} ya estudiados · ${conceptos.length-dominados} por ver`));

  const pend=S.data.notas.filter(n=>n.estado==='pendiente'||n.estado==='borrador').length;
  top.append(tile('Notas sin cerrar', pend, pend?'Pendientes o en borrador':'Todo al día'));

  const en30=evs.filter(e=>dias(e.fecha)<=30).length;
  top.append(tile('Hitos en 30 días', en30, en30?'Entregas, parciales y defensas':'Mes despejado'));
  m.append(top);

  // Materias
  const secM=el('section'); secM.style.marginBottom='18px';
  secM.append(el('h2','','Materias'));
  const gm=el('div','grid g2');
  S.data.materias.filter(mat=>!mat.archivada).forEach(mat=>{
    const c=el('div','card');
    const h=el('div','spread'); h.style.marginBottom='14px';
    const left=el('div','row');
    left.append(el('i','dotk','')); left.lastChild.style.background=matColor(mat.id);
    left.append(el('div','',`<div style="font-weight:600;letter-spacing:-.01em">${esc(mat.corto)}</div>
      <div class="tiny muted">${mat.total} notas${mat.unidades.length?' · '+mat.unidades.length+' unidades':''}</div>`));
    const b=el('button','btn sm','Abrir'); b.onclick=()=>go(`#/materia?id=${encodeURIComponent(mat.id)}`);
    h.append(left,b); c.append(h);
    c.append(stackEstado(mat.conteo));
    const evsM=evs.filter(e=>e.materia===mat.id).slice(0,2);
    if(evsM.length){
      const ul=el('div'); ul.style.marginTop='14px';
      evsM.forEach(e=>{
        const d=dias(e.fecha);
        ul.append(el('div','tiny sec',`<span style="display:inline-block;width:52px;color:var(--ink-3);font-variant-numeric:tabular-nums">${fmtFecha(e.fecha)}</span>${esc(e.titulo.slice(0,52))} <span class="badge">${d===0?'hoy':'en '+d+'d'}</span>`));
      });
      c.append(ul);
    }
    gm.append(c);
  });
  secM.append(gm); m.append(secM);

  // Próximos hitos + salud
  const bottom=el('div','grid g2');
  const cE=el('div','card');
  cE.append(el('div','spread',`<h2 style="margin:0">Próximos hitos</h2>`));
  const tbl=el('table');
  tbl.innerHTML='<thead><tr><th>Fecha</th><th>Evento</th><th>Materia</th><th class="num">Faltan</th></tr></thead>';
  const tb=el('tbody');
  proximos(8).forEach(e=>{
    const tr=el('tr');
    const d=dias(e.fecha);
    tr.innerHTML=`<td class="mono" style="color:var(--ink-2)">${fmtFecha(e.fecha)}</td>
      <td><span class="dotk" style="display:inline-block;background:var(${EV_COLOR[e.tipo]||'--ink-3'});margin-right:7px"></span>${esc(e.titulo)}</td>
      <td class="sec tiny">${esc(e.materia||'—')}</td>
      <td class="num">${d===0?'hoy':d+' d'}</td>`;
    tb.append(tr);
  });
  if(!tb.children.length) tb.innerHTML='<tr><td colspan="4" class="muted">Sin fechas futuras</td></tr>';
  tbl.append(tb); cE.append(tbl); bottom.append(cE);

  const cS=el('div','card');
  cS.append(el('h2','','Salud del vault'));
  const sal=S.salud;
  if(!sal){ cS.append(el('div','muted tiny','Calculando…')); }
  else {
    const items=[
      ['Wikilinks rotos', sal.rotos.length, sal.rotos.length?'bad':'ok'],
      ['Stems duplicados', sal.duplicados.length, sal.duplicados.length?'warn':'ok'],
      ['Valores de estado fuera de convención', sal.derivaEstado.length, sal.derivaEstado.length?'warn':'ok'],
      ['Conceptos con menos de 3 conexiones', sal.conexionesPobres.length, sal.conexionesPobres.length?'warn':'ok'],
    ];
    items.forEach(([l,v,st])=>{
      const r=el('div','spread'); r.style.padding='7px 0'; r.style.borderBottom='1px solid var(--grid)';
      const color = st==='ok'?'--good':st==='bad'?'--crit':'--warn';
      const icon  = st==='ok'?'✓':st==='bad'?'✕':'!';
      r.innerHTML=`<span class="tiny sec">${l}</span>
        <span class="row" style="gap:7px"><span style="color:var(${color});font-weight:700">${icon}</span>
        <b style="font-variant-numeric:tabular-nums">${v}</b></span>`;
      cS.append(r);
    });
    const b=el('button','btn sm','Ver detalle'); b.style.marginTop='12px';
    b.onclick=()=>go('#/salud'); cS.append(b);
  }
  bottom.append(cS);
  m.append(bottom);
}

function viewMateria(){
  const m=$('#main'); m.innerHTML='';
  const id=S.params.id;
  const mat=S.data.materias.find(x=>x.id===id);
  if(!mat){ m.innerHTML='<div class="empty">Materia no encontrada</div>'; return; }
  const notas=S.data.notas.filter(n=>n.materia===id);

  const head=el('div','head');
  head.append(el('div','',`<h1>${esc(mat.nombre)}</h1>
    <div class="sub">${notas.length} notas · carpeta <code>${esc(id)}/</code></div>`));
  const acts=el('div','row');
  const b=el('button','btn primary','+ Nota en esta materia');
  b.onclick=()=>go(`#/nueva?materia=${encodeURIComponent(id)}`);
  const bAdm=el('button','btn','Editar materia');
  bAdm.onclick=()=>go('#/materias');
  acts.append(b,bAdm); head.append(acts); m.append(head);

  const c=el('div','card'); c.style.marginBottom='16px';
  c.append(el('h3','','Estado de estudio'));

  const evs=(S.data.eventos||[]).filter(e=>e.materia===id && dias(e.fecha)>=0).slice(0,6);
  if(evs.length){
    const ce=el('div','card'); ce.style.marginBottom='16px';
    ce.append(el('h3','','Fechas por delante'));
    const t=el('table');
    t.innerHTML='<thead><tr><th>Fecha</th><th>Evento</th><th class="num">Faltan</th></tr></thead>';
    const tb=el('tbody');
    evs.forEach(e=>{ const d=dias(e.fecha);
      tb.innerHTML+=`<tr><td class="mono sec">${fmtFecha(e.fecha)}</td><td>${esc(e.titulo)}</td><td class="num">${d===0?'hoy':d+' d'}</td></tr>`;});
    t.append(tb); ce.append(t); m.append(ce);
  }

  if(!notas.length){
    const vacio=el('div','card');
    vacio.innerHTML=`<div class="empty">Todavía no hay notas en <code>${esc(id)}/</code>.<br>
      <span class="tiny">La carpeta y los archivos de seguimiento ya están creados — falta cargar contenido.</span></div>`;
    m.append(vacio);
    return;
  }

  const grupos={};
  notas.forEach(n=>{ const k=n.tipo||'sin-tipo'; (grupos[k]=grupos[k]||[]).push(n); });
  const orden=['moc','seguimiento','unidad','tp','entrega','concepto','clase','sin-tipo'];
  const g=el('div','grid g2');
  orden.filter(k=>grupos[k]).forEach(k=>{
    const card=el('div','card');
    card.append(el('h3','',`${TIPO_LBL[k]||k} <span class="badge">${grupos[k].length}</span>`));
    grupos[k].sort((a,b)=>a.titulo.localeCompare(b.titulo)).forEach(n=>{
      const r=el('div','note-row');
      const idx=ESTADOS.indexOf(n.estado);
      r.innerHTML=`<div><div class="t">${esc(n.titulo)}</div>${
        n.unidad?`<div class="x">${esc(String(n.unidad))}</div>`:''}</div>
        <div class="row" style="gap:6px">${n.estado?
          `<span class="swatch" style="background:var(${ORD[idx]})" title="${ESTADO_LBL[n.estado]}"></span>
           <span class="tiny muted">${ESTADO_LBL[n.estado]}</span>`:'<span class="tiny muted">—</span>'}</div>`;
      r.onclick=()=>go(`#/nota?rel=${encodeURIComponent(n.rel)}`);
      card.append(r);
    });
    g.append(card);
  });
  m.append(g);
}

function campo(lbl,node,ayuda){
  const w=el('div'); w.style.marginBottom='13px';
  w.append(el('div','tiny sec',lbl)); w.lastChild.style.marginBottom='5px';
  w.append(node);
  if(ayuda){ w.append(el('div','tiny muted',ayuda)); w.lastChild.style.marginTop='4px'; }
  return w;
}

function selectorColor(valor){
  const s=el('select','input');
  MAT_SLOT.forEach((_,i)=>s.append(new Option(SLOT_LBL[i],i)));
  s.value=String(valor??0);
  return s;
}

let notasFiltro={q:'',materia:'',tipo:'',estado:''};
function viewNotas(){
  const m=$('#main'); m.innerHTML='';
  const head=el('div','head');
  head.append(el('div','',`<h1>Notas</h1><div class="sub">${S.data.notas.length} archivos markdown en el vault</div>`));
  const b=el('button','btn primary','+ Nueva'); b.onclick=()=>go('#/nueva'); head.append(b);
  m.append(head);

  // Una sola fila de filtros arriba de todo lo que filtra.
  const bar=el('div','card'); bar.style.marginBottom='14px';
  const q=el('input','input'); q.placeholder='Buscar por título, texto o etiqueta…'; q.value=notasFiltro.q;
  bar.append(q);
  const chips=el('div','row'); chips.style.marginTop='11px';
  const mkChips=(label,key,vals,fmt)=>{
    const grp=el('div','row'); grp.style.gap='5px';
    grp.append(el('span','tiny muted',label));
    vals.forEach(v=>{
      const c=el('button','chip'+(notasFiltro[key]===v?' on':''),fmt?fmt(v):v);
      c.onclick=()=>{ notasFiltro[key]= notasFiltro[key]===v?'':v; viewNotas(); };
      grp.append(c);
    });
    chips.append(grp);
  };
  mkChips('Materia','materia',S.data.materias.map(x=>x.id),v=>{
    const mm=S.data.materias.find(x=>x.id===v); return mm?mm.corto:v; });
  mkChips('Tipo','tipo',[...new Set(S.data.notas.map(n=>n.tipo).filter(Boolean))].sort(),v=>TIPO_LBL[v]||v);
  mkChips('Estado','estado',ESTADOS,v=>ESTADO_LBL[v]);
  bar.append(chips); m.append(bar);

  const list=el('div','card');
  const render=()=>{
    list.innerHTML='';
    const term=notasFiltro.q.toLowerCase();
    const out=S.data.notas.filter(n=>{
      if(notasFiltro.materia && n.materia!==notasFiltro.materia) return false;
      if(notasFiltro.tipo && n.tipo!==notasFiltro.tipo) return false;
      if(notasFiltro.estado && n.estado!==notasFiltro.estado) return false;
      if(term){
        const hay=(n.titulo+' '+n.rel+' '+(n.excerpt||'')+' '+(n.tags||[]).join(' ')).toLowerCase();
        if(!hay.includes(term)) return false;
      }
      return true;
    }).sort((a,b)=>b.mtime-a.mtime);
    list.append(el('div','tiny muted',`${out.length} resultado${out.length===1?'':'s'}`));
    if(!out.length){ list.append(el('div','empty','Nada coincide con esos filtros')); return; }
    out.forEach(n=>{
      const r=el('div','note-row');
      const idx=ESTADOS.indexOf(n.estado);
      r.innerHTML=`<div>
        <div class="t">${esc(n.titulo)}</div>
        <div class="x">${esc(n.excerpt||n.rel)}</div></div>
        <div style="text-align:right">
          <div class="row" style="justify-content:flex-end;gap:6px">
            <span class="dotk" style="background:${matColor(n.materia)}"></span>
            <span class="tiny muted">${esc(n.materia||'—')}</span></div>
          <div class="tiny muted" style="margin-top:4px">${
            n.estado?`<span class="swatch" style="display:inline-block;background:var(${ORD[idx]})"></span> ${ESTADO_LBL[n.estado]}`:'—'}</div>
        </div>`;
      r.onclick=()=>go(`#/nota?rel=${encodeURIComponent(n.rel)}`);
      list.append(r);
    });
  };
  q.addEventListener('input',()=>{notasFiltro.q=q.value; render();});
  render(); m.append(list);
}

   ['estado',ESTADO_LBL[fm.estado]||fm.estado],['autor',fm.autor]]
   .forEach(([k,v])=>{ if(v) meta.append(el('span','badge',esc(String(v)))); });
  (Array.isArray(fm.tags)?fm.tags:[]).forEach(t=>meta.append(el('span','badge','#'+esc(t))));
  m.append(meta);

  const g=el('div','grid'); g.style.gridTemplateColumns='minmax(0,1fr) 250px'; g.style.gap='26px';
  if(innerWidth<900) g.style.gridTemplateColumns='1fr';
  const art=el('article','prose'); art.innerHTML=renderMd(cuerpoSinH1); g.append(art);
  // Si venís del buscador, se marca el término y se salta a la primera aparición.
  if(S.params.q) setTimeout(()=>marcarEnNota(art,S.params.q),60);

  const side=el('div','side-fijo');
  const cb=el('div','card');
  cb.append(el('h3','',`Backlinks <span class="badge">${d.backlinks.length}</span>`));
  if(!d.backlinks.length) cb.append(el('div','tiny muted','Ninguna nota enlaza a esta.'));
  d.backlinks.forEach(b=>{
    const a=el('div','note-row'); a.style.padding='7px 9px';
    a.innerHTML=`<div class="tiny">${esc(b.titulo)}</div>`;
    a.onclick=()=>go(`#/nota?rel=${encodeURIComponent(b.rel)}`);
    cb.append(a);
  });
  side.append(cb); g.append(side);
  m.append(g);
  enhance(art);
}

   Capa local (sin IA): autocompletado de wikilinks y avisos al guardar
   ========================================================================= */

/** Sugiere stems existentes cuando estás escribiendo dentro de [[ ]]. */
function autocompletarWikilinks(ta){
  const caja=el('div'); caja.style.cssText=
    'position:absolute;z-index:80;background:var(--surface-2);border:1px solid var(--hair);'+
    'border-radius:9px;box-shadow:var(--shadow);max-height:230px;overflow-y:auto;display:none;min-width:260px';
  document.body.append(caja);
  let items=[], sel=0, desde=-1;

  const cerrar=()=>{caja.style.display='none'; items=[]; desde=-1;};

  const insertar=(stem)=>{
    const v=ta.value, fin=ta.selectionStart;
    const cierra=v.slice(fin,fin+2)===']]';
    ta.value=v.slice(0,desde)+stem+(cierra?'':']]')+v.slice(fin);
    const pos=desde+stem.length+2;
    ta.selectionStart=ta.selectionEnd=pos;
    cerrar(); ta.focus(); ta.dispatchEvent(new Event('input'));
  };

  const pintar=()=>{
    caja.innerHTML='';
    items.forEach((s,i)=>{
      const r=el('div','',`<span>${esc(s.stem)}</span> <span class="tiny muted">${esc(s.materia||'')}</span>`);
      r.style.cssText='padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:13.5px'
        +(i===sel?';background:color-mix(in oklab,var(--m1) 16%,transparent)':'');
      r.onmousedown=e=>{e.preventDefault(); insertar(s.stem);};
      caja.append(r);
    });
  };

  // Para ubicar la lista justo debajo del cursor se replica el textarea en un
  // div invisible con los mismos estilos y se mide dónde cae el caret.
  const espejo=el('div');
  espejo.style.cssText='position:absolute;visibility:hidden;white-space:pre-wrap;word-wrap:break-word;top:0;left:0';
  document.body.append(espejo);

  const ubicar=()=>{
    const cs=getComputedStyle(ta);
    ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','padding','border','boxSizing']
      .forEach(k=>{ espejo.style[k]=cs[k]; });
    espejo.style.width=ta.clientWidth+'px';
    espejo.textContent=ta.value.slice(0,ta.selectionStart);
    const marca=el('span'); marca.textContent='​';
    espejo.append(marca);
    const r=ta.getBoundingClientRect();
    const alto=parseFloat(cs.lineHeight)||20;
    let x=r.left+marca.offsetLeft-ta.scrollLeft;
    let y=r.top+marca.offsetTop-ta.scrollTop+alto+4;
    // Si no entra abajo, se abre hacia arriba.
    if(y+240>innerHeight) y=Math.max(60, r.top+marca.offsetTop-ta.scrollTop-236);
    caja.style.left=Math.max(8,Math.min(x, innerWidth-300))+'px';
    caja.style.top=Math.max(60,y)+'px';
  };

  ta.addEventListener('input',()=>{
    const antes=ta.value.slice(0,ta.selectionStart);
    const m=antes.match(/\[\[([^\]\n[]*)$/);
    if(!m){ cerrar(); return; }
    desde=ta.selectionStart-m[1].length;
    const q=m[1].toLowerCase();
    items=(S.data?.notas||[])
      .filter(n=>n.stem.toLowerCase().includes(q))
      .sort((a,b)=>{
        const ae=a.stem.toLowerCase().startsWith(q)?0:1, be=b.stem.toLowerCase().startsWith(q)?0:1;
        return ae-be || a.stem.localeCompare(b.stem);
      })
      .slice(0,12)
      .map(n=>({stem:n.stem,materia:n.materia}));
    if(!items.length){ cerrar(); return; }
    sel=0; pintar(); ubicar(); caja.style.display='block';
  });

  ta.addEventListener('keydown',e=>{
    if(caja.style.display==='none') return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); sel=Math.max(0,Math.min(items.length-1,sel+(e.key==='ArrowDown'?1:-1))); pintar();
    } else if(e.key==='Enter'||e.key==='Tab'){
      e.preventDefault(); insertar(items[sel].stem);
    } else if(e.key==='Escape'){ cerrar(); }
  });
  ta.addEventListener('blur',()=>setTimeout(cerrar,120));
  ta.addEventListener('scroll',cerrar);
  return ()=>{caja.remove(); espejo.remove();};
}

/** Chequeos deterministas que corren al guardar. No bloquean: avisan. */
function avisosDeNota(texto){
  const avisos=[];
  const {fm,body}=splitFm(texto);
  const stems=stemsSet();
  const rotos=[...new Set([...stripCodeCliente(body).matchAll(/\[\[([^\]|#\n]+)/g)]
    .map(m=>m[1].trim()).filter(t=>t && !stems.has(t)))];
  if(rotos.length) avisos.push({tipo:'bad',txt:`Wikilinks rotos: ${rotos.map(r=>'[['+r+']]').join(', ')}`});
  if(!fm) avisos.push({tipo:'warn',txt:'La nota no tiene frontmatter.'});
  else {
    const est=(fm.match(/^estado:\s*(.+)$/m)||[])[1];
    if(est && !ESTADOS.includes(est.trim().toLowerCase()))
      avisos.push({tipo:'warn',txt:`El estado "${est.trim()}" no está en la convención (pendiente · borrador · estudiado · dominado).`});
    if(/^tipo:\s*concepto/m.test(fm) && !/^##\s*Conexiones/m.test(body))
      avisos.push({tipo:'warn',txt:'Es un concepto y no tiene bloque ## Conexiones.'});
  }
  const conex=(body.match(/^##\s*Conexiones([\s\S]*?)(?=^##\s|\Z)/m)||[])[1];
  if(conex){
    const n=(conex.match(/\[\[/g)||[]).length;
    if(n>0 && n<3) avisos.push({tipo:'warn',txt:`El bloque Conexiones tiene ${n} enlace${n===1?'':'s'}; la convención pide entre 3 y 6.`});
  }
  if(/[│├└─┌┐┘┴┬┤]|─→|\+---/.test(body))
    avisos.push({tipo:'bad',txt:'Parece haber ASCII art. La convención pide Mermaid.'});
  return avisos;
}
function stripCodeCliente(s){
  return s.replace(/```[\s\S]*?```/g,'').replace(/`[^`\n]*`/g,'');
}

/* ---------- Diff por líneas (LCS), para revisar lo que propone Claude ---------- */
function diffLineas(a,b){
  const A=a.split('\n'), B=b.split('\n');
  const n=A.length, m=B.length;
  // LCS con matriz; las notas son chicas, no hace falta nada más sofisticado.
  const L=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j]= A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){
    if(A[i]===B[j]){ out.push({t:'=',l:A[i]}); i++; j++; }
    else if(L[i+1][j]>=L[i][j+1]){ out.push({t:'-',l:A[i]}); i++; }
    else { out.push({t:'+',l:B[j]}); j++; }
  }
  while(i<n){ out.push({t:'-',l:A[i++]}); }
  while(j<m){ out.push({t:'+',l:B[j++]}); }
  return out;
}

function pintarDiff(a,b){
  const wrap=el('div');
  wrap.style.cssText='font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;'+
    'line-height:1.6;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;'+
    'padding:12px 0;max-height:52vh;overflow:auto';
  let iguales=0;
  diffLineas(a,b).forEach(d=>{
    if(d.t==='='){ iguales++; if(iguales>3) return; }
    else iguales=0;
    const r=el('div');
    const bg=d.t==='+'?'color-mix(in oklab,var(--good) 16%,transparent)'
           :d.t==='-'?'color-mix(in oklab,var(--crit) 16%,transparent)':'transparent';
    r.style.cssText=`padding:1px 14px;white-space:pre-wrap;word-break:break-word;background:${bg};`+
      (d.t==='='?'opacity:.5;':'');
    r.textContent=(d.t==='='?'  ':d.t+' ')+d.l;
    wrap.append(r);
  });
  return wrap;
}

function splitFm(text){
  if(!text.startsWith('---')) return {fm:'',body:text};
  const i=text.indexOf('\n---',3);
  if(i===-1) return {fm:'',body:text};
  return {fm:text.slice(0,i+4), body:text.slice(text.indexOf('\n',i+1)+1)};
}

  const unidad=el('input','input'); unidad.placeholder='U2 (opcional)';
  const carpeta=el('input','input');

  // Precarga desde Cobertura: "este tema del programa no tiene nota" → crearla.
  if(S.params.titulo) titulo.value=S.params.titulo;
  if(S.params.unidad) unidad.value=S.params.unidad;
  if(S.params.tipo) tipo.value=S.params.tipo;

  const CARPETA={concepto:'04-Conceptos',unidad:'01-Unidades',tp:'02-TPs',
    entrega:'03-Proyecto-Catedra',clase:'06-Clases',seguimiento:'00-Seguimiento'};
  const syncPath=()=>{ carpeta.value=`${materia.value}/${CARPETA[tipo.value]||''}`; };
  tipo.onchange=syncPath; materia.onchange=syncPath; syncPath();

  c.append(f('Título',titulo),f('Materia',materia),f('Tipo',tipo),
           f('Unidad',unidad),f('Carpeta destino',carpeta));
  const msg=el('div','tiny muted'); msg.style.marginBottom='10px';

      msg.innerHTML=`Ya existe una nota con el stem <b>${esc(stem)}</b>. La convención pide stems únicos en todo el vault.`;
      return;
    }
    const destino=carpeta.value.replace(/^\/+|\/+$/g,'');
    // La materia del frontmatter se deriva SIEMPRE de la carpeta destino: si se
    // toman del select, una carpeta editada a mano deja la nota con la materia
    // equivocada y el wikilink [[Materia]] roto.
    const materiaReal=destino.split('/')[0] || materia.value;
    if(materiaReal!==materia.value){
      msg.innerHTML=`La carpeta destino es <b>${esc(destino)}</b>, que pertenece a
        <b>${esc(materiaReal)}</b>, pero arriba elegiste <b>${esc(materia.value)}</b>.
        Corregí una de las dos para que la nota no quede con la materia equivocada.`;
      return;
    }
    const rel=`${destino}/${stem}.md`;
    const fmLines=['---',`tipo: ${tipo.value}`,`materia: ${materiaReal}`];
    if(unidad.value.trim()) fmLines.push(`unidad: ${unidad.value.trim()}`);
    fmLines.push('estado: pendiente',
      `tags: [${materiaReal}${unidad.value.trim()?', '+unidad.value.trim():''}]`,'---');
    let body=`\n# ${t}\n\n> Resumen en una frase.\n\n**Materia:** [[${materiaReal}]]\n\n## Desarrollo\n\n`;
    if(tipo.value==='concepto')
      body+=`\n## Conexiones\n\n- [[ ]] — por qué se conectan\n- [[ ]] — por qué se conectan\n- [[ ]] — por qué se conectan\n\n## En el parcial\n\n`;
    try{
      await api('/api/nota',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rel,contenido:fmLines.join('\n')+body})});
      await load(true); go(`#/editar?rel=${encodeURIComponent(rel)}`);
    }catch(e){ msg.textContent='Error: '+e.message; }
  };
}

}

async function viewGrafo(){
  const m=$('#main'); m.innerHTML='';
  m.append(el('div','head',`<div><h1>Mapa de conceptos</h1>
    <div class="sub">Cada línea es un wikilink entre notas. El tamaño del nodo es la cantidad de conexiones.</div></div>`));
  if(!S.grafo) S.grafo=await api('/api/grafo');
  const g=JSON.parse(JSON.stringify(S.grafo));

  const bar=el('div','card'); bar.style.marginBottom='12px';
  const chips=el('div','row');
  let filtroMat='';
  const mk=(v,l)=>{const c=el('button','chip'+(filtroMat===v?' on':''),l);
    c.dataset.val=v; c.onclick=()=>{filtroMat=v; viewGrafoDraw();}; return c;};
  chips.append(el('span','tiny muted','Materia'));
  chips.append(mk('','Todas'));
  S.data.materias.forEach(x=>chips.append(mk(x.id,x.corto)));
  bar.append(chips);

  const lg=el('div','legend');
  S.data.materias.forEach(x=>lg.append(el('span','',
    `<i class="dotk" style="background:${matColor(x.id)}"></i>${esc(x.corto)}`)));
  bar.append(lg);
  m.append(bar);

  const svgWrap=el('div'); m.append(svgWrap);
  const info=el('div','tiny muted'); info.style.marginTop='10px'; m.append(info);

  function viewGrafoDraw(){
    chips.querySelectorAll('.chip').forEach((c)=>c.classList.toggle('on',c.dataset.val===filtroMat));
    svgWrap.innerHTML='';
    const nodes=g.nodes.filter(n=>!filtroMat||n.materia===filtroMat);
    const ids=new Set(nodes.map(n=>n.id));
    const links=g.links.filter(l=>ids.has(l.source.id||l.source)&&ids.has(l.target.id||l.target))
      .map(l=>({source:l.source.id||l.source,target:l.target.id||l.target}));
    info.innerHTML='';
    info.append(el('div','tiny muted',`${nodes.length} notas · ${links.length} conexiones · arrastrá los nodos, rueda para zoom`));
    // Vista de tabla: el grafo nunca es la única forma de leer el dato.
    const tw=el('div','card'); tw.style.marginTop='14px';
    tw.append(el('h3','','Notas más conectadas'));
    const t=el('table');
    t.innerHTML='<thead><tr><th>Nota</th><th>Materia</th><th>Tipo</th><th class="num">Conexiones</th></tr></thead>';
    const tb=el('tbody');
    [...nodes].sort((a,b)=>b.grado-a.grado).slice(0,15).forEach(n=>{
      const tr=el('tr'); tr.style.cursor='pointer';
      tr.innerHTML=`<td>${esc(n.titulo)}</td><td class="tiny sec">${esc(n.materia||'—')}</td>
        <td class="tiny sec">${TIPO_LBL[n.tipo]||n.tipo}</td><td class="num">${n.grado}</td>`;
      tr.onclick=()=>go(`#/nota?rel=${encodeURIComponent(n.rel)}`);
      tb.append(tr);
    });
    t.append(tb); tw.append(t); info.append(tw);

    const rad=d=>4.5+Math.min(Math.sqrt(d.grado)*2.6,11);
    const zoom=d3.zoom().scaleExtent([0.2,4]);
    const svg=d3.select(svgWrap).append('svg').attr('id','graph');
    // Se mide DESPUÉS de insertarlo: así el viewBox coincide con el tamaño real
    // que le da el CSS y el grafo queda centrado de verdad.
    const box=svg.node().getBoundingClientRect();
    const W=Math.max(600,Math.round(box.width)), H=Math.max(460,Math.round(box.height));
    svg.attr('viewBox',[0,0,W,H]).attr('preserveAspectRatio','xMidYMid meet');
    const root=svg.append('g');
    zoom.on('zoom',ev=>root.attr('transform',ev.transform));
    svg.call(zoom);

    const sim=d3.forceSimulation(nodes)
      .force('link',d3.forceLink(links).id(d=>d.id).distance(78).strength(.4))
      .force('charge',d3.forceManyBody().strength(-340).distanceMax(460))
      .force('x',d3.forceX(W/2).strength(.06))
      .force('y',d3.forceY(H/2).strength(.08))
      .force('center',d3.forceCenter(W/2,H/2))
      .force('collide',d3.forceCollide(d=>rad(d)+14));

    const line=root.append('g').attr('stroke',cssv('--grid')).attr('stroke-width',1)
      .selectAll('line').data(links).join('line');

    const node=root.append('g').selectAll('circle').data(nodes).join('circle')
      .attr('r',rad).attr('fill',d=>matColor(d.materia))
      .attr('stroke',cssv('--surface-1')).attr('stroke-width',2)
      .on('mousemove',(e,d)=>showTip(e,`<b>${esc(d.titulo)}</b><br>
        <span style="color:var(--ink-3)">${TIPO_LBL[d.tipo]||d.tipo} · ${esc(d.materia||'')}${
        d.unidad?' · '+esc(String(d.unidad)):''}</span><br>${d.grado} conexiones`))
      .on('mouseleave',hideTip)
      .on('click',(e,d)=>go(`#/nota?rel=${encodeURIComponent(d.rel)}`))
      .call(d3.drag()
        .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
        .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
        .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

    // Etiquetas selectivas: sólo los 12 nodos más conectados. El resto se lee
    // en el hover y en la lista de abajo — ninguna etiqueta queda pisada.
    const destacados=[...nodes].sort((a,b)=>b.grado-a.grado).slice(0,6);
    const lab=root.append('g').selectAll('text').data(destacados).join('text')
      .text(d=>d.titulo.length>24?d.titulo.slice(0,23)+'…':d.titulo)
      .attr('text-anchor','middle').attr('dy',d=>-(rad(d)+7))
      .attr('fill',cssv('--ink-1')).attr('paint-order','stroke')
      .attr('stroke',cssv('--surface-1')).attr('stroke-width',3.5);

    sim.on('tick',()=>{
      line.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
          .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('cx',d=>d.x).attr('cy',d=>d.y);
      lab.attr('x',d=>d.x).attr('y',d=>d.y);
    });

    // Cuando la simulación se asienta, encuadra el grafo en el panel:
    // sin esto queda un puñado de nodos chicos en el medio de mucho vacío.
    sim.on('end',()=>{
      if(!nodes.length) return;
      const xs=nodes.map(d=>d.x), ys=nodes.map(d=>d.y);
      const x0=Math.min(...xs), x1=Math.max(...xs);
      const y0=Math.min(...ys), y1=Math.max(...ys);
      const pad=48;
      const k=Math.min(3, Math.max(0.25,
        Math.min((W-pad*2)/Math.max(1,x1-x0), (H-pad*2)/Math.max(1,y1-y0))));
      const tx=W/2-k*(x0+x1)/2, ty=H/2-k*(y0+y1)/2;
      svg.transition().duration(450)
        .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(k));
    });
  }
  viewGrafoDraw();
}

/* =========================================================================
   Gráficos de Economía
   Las curvas salen de las funciones, no de trazos a ojo: por eso los cruces
   caen exactamente donde la teoría dice que caen.
   ========================================================================= */

// Producción de corto plazo:  PT = A·L² − B·L³
const PROD = {A:6, B:0.4};
const fPT  = L => PROD.A*L*L - PROD.B*L*L*L;
const fPMe = L => L<=0 ? 0 : PROD.A*L - PROD.B*L*L;
const fPMg = L => 2*PROD.A*L - 3*PROD.B*L*L;
const L_OPT = PROD.A/(2*PROD.B);        // óptimo técnico: max PMe, PMg = PMe
const L_MAX = 2*PROD.A/(3*PROD.B);      // máximo técnico: max PT, PMg = 0

// Costos de corto plazo:  CT = CF + aQ − bQ² + cQ³
const COST = {a:20, b:2, c:0.1};
const fCV   = Q => COST.a*Q - COST.b*Q*Q + COST.c*Q*Q*Q;
const fCT   = (Q,CF) => CF + fCV(Q);
const fCVMe = Q => Q<=0?NaN : COST.a - COST.b*Q + COST.c*Q*Q;
const fCFMe = (Q,CF) => Q<=0?NaN : CF/Q;
const fCTMe = (Q,CF) => Q<=0?NaN : CF/Q + fCVMe(Q);
const fCMg  = Q => COST.a - 2*COST.b*Q + 3*COST.c*Q*Q;
const Q_CVME = COST.b/(2*COST.c);       // min CVMe = donde lo corta el CMg
const Q_CMG  = COST.b/(3*COST.c);       // min CMg
function qMinCTMe(CF){                  // min CTMe: se busca numéricamente
  let mejor=1, v=Infinity;
  for(let q=1;q<=30;q+=0.01){ const y=fCTMe(q,CF); if(y<v){v=y;mejor=q;} }
  return mejor;
}

/** Dibuja un plano cartesiano con curvas, marcas y lectura al pasar el mouse. */
function grafico(op){
  const W=op.ancho||560, H=op.alto||320, P={t:18,r:96,b:52,l:52};
  const cont=el('div'); cont.style.position='relative';
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.style.cssText='width:100%;height:auto;display:block;overflow:visible';
  // Todo lo que se sale del plano se recorta: una curva que se escapa no debe
  // pintar encima del texto de la tarjeta.
  const clipId='clip'+Math.round(performance.now()*1000)+op.series.length;
  const defs=document.createElementNS(NS,'defs');
  const cp=document.createElementNS(NS,'clipPath'); cp.setAttribute('id',clipId);
  const cr=document.createElementNS(NS,'rect');
  const X=v=>P.l+(v-op.x.min)/(op.x.max-op.x.min)*(W-P.l-P.r);
  const Y=v=>H-P.b-(v-op.y.min)/(op.y.max-op.y.min)*(H-P.t-P.b);
  const mk=(t,at)=>{const n=document.createElementNS(NS,t);for(const k in at)n.setAttribute(k,at[k]);return n;};
  cr.setAttribute('x',P.l); cr.setAttribute('y',P.t-2);
  cr.setAttribute('width',W-P.l-P.r); cr.setAttribute('height',H-P.t-P.b+2);
  cp.append(cr); defs.append(cp); svg.append(defs);

  // Bandas de fondo (las etapas de producción, por ejemplo)
  (op.bandas||[]).forEach(b=>{
    svg.append(mk('rect',{x:X(b.x0),y:P.t,width:Math.max(0,X(b.x1)-X(b.x0)),height:H-P.t-P.b,
      fill:cssv(b.color),opacity:.10}));
    if(X(b.x1)-X(b.x0)>68){
      const tx=mk('text',{x:(X(b.x0)+X(b.x1))/2,y:P.t+13,'text-anchor':'middle',
        'font-size':10,fill:cssv('--ink-3')}); tx.textContent=b.texto; svg.append(tx);
    }
  });

  // Grilla y ejes: hairline, sólidos, un paso del fondo
  const pasos=5;
  for(let i=0;i<=pasos;i++){
    const v=op.y.min+(op.y.max-op.y.min)*i/pasos;
    svg.append(mk('line',{x1:P.l,x2:W-P.r,y1:Y(v),y2:Y(v),stroke:cssv('--grid'),'stroke-width':1}));
    const t=mk('text',{x:P.l-8,y:Y(v)+3.5,'text-anchor':'end','font-size':10,
      fill:cssv('--ink-3'),'font-variant-numeric':'tabular-nums'});
    t.textContent=Math.round(v); svg.append(t);
  }
  svg.append(mk('line',{x1:P.l,x2:W-P.r,y1:Y(op.y.min),y2:Y(op.y.min),stroke:cssv('--axis'),'stroke-width':1}));
  svg.append(mk('line',{x1:P.l,x2:P.l,y1:P.t,y2:H-P.b,stroke:cssv('--axis'),'stroke-width':1}));
  for(let i=0;i<=5;i++){
    const v=op.x.min+(op.x.max-op.x.min)*i/5;
    const t=mk('text',{x:X(v),y:H-P.b+15,'text-anchor':'middle','font-size':10,
      fill:cssv('--ink-3'),'font-variant-numeric':'tabular-nums'});
    t.textContent=Math.round(v*10)/10; svg.append(t);
  }
  const ejeX=mk('text',{x:(P.l+W-P.r)/2,y:H-2,'text-anchor':'middle','font-size':10.5,fill:cssv('--ink-2')});
  ejeX.textContent=op.x.label; svg.append(ejeX);
  const ejeY=mk('text',{x:14,y:(P.t+H-P.b)/2,'text-anchor':'middle','font-size':10.5,
    fill:cssv('--ink-2'),transform:`rotate(-90 14 ${(P.t+H-P.b)/2})`});
  ejeY.textContent=op.y.label; svg.append(ejeY);

  // Curvas: 2px, extremo redondeado, etiqueta directa al final
  const N=280;
  op.series.forEach(s=>{
    let d='', ultimo=null;
    for(let i=0;i<=N;i++){
      const x=op.x.min+(op.x.max-op.x.min)*i/N;
      const y=s.f(x);
      if(!isFinite(y) || y<op.y.min-1e6 || y>op.y.max*3){ d+=''; continue; }
      const py=Math.max(P.t-40,Math.min(H-P.b+40,Y(y)));
      if(y>=op.y.min && y<=op.y.max) ultimo={x:X(x),y:py};
      d+=(d?' L ':'M ')+X(x)+' '+py;
    }
    svg.append(mk('path',{d,fill:'none',stroke:cssv(s.color),'stroke-width':2,
      'stroke-linecap':'round','stroke-linejoin':'round','clip-path':`url(#${clipId})`,
      ...(s.punteada?{'stroke-dasharray':'5 4'}:{})}));
    if(ultimo){
      const t=mk('text',{x:Math.min(ultimo.x+8,W-P.r+8),y:ultimo.y+3.5,'font-size':11,
        fill:cssv('--ink-1'),'font-weight':600});
      t.textContent=s.nombre; svg.append(t);
    }
  });

  // Marcas: los puntos con nombre propio
  (op.marcas||[]).forEach((p,i)=>{
    svg.append(mk('line',{x1:X(p.x),x2:X(p.x),y1:P.t,y2:H-P.b,
      stroke:cssv(p.color||'--ink-3'),'stroke-width':1,'stroke-dasharray':'3 3',opacity:.75}));
    if(p.y!=null){
      svg.append(mk('circle',{cx:X(p.x),cy:Y(p.y),r:4.5,fill:cssv(p.color||'--ink-1'),
        stroke:cssv('--surface-1'),'stroke-width':2}));
    }
    const t=mk('text',{x:X(p.x),y:H-P.b+(i%2?40:28),'text-anchor':'middle','font-size':10,
      fill:cssv(p.color||'--ink-2'),'font-weight':600});
    t.textContent=p.texto; svg.append(t);
  });

  // Capa de lectura: cruz + valores de todas las series
  const cruz=mk('line',{y1:P.t,y2:H-P.b,stroke:cssv('--ink-3'),'stroke-width':1,opacity:0});
  svg.append(cruz);
  const puntos=op.series.map(()=>{
    const c=mk('circle',{r:4,fill:'none',stroke:cssv('--surface-1'),'stroke-width':2,opacity:0});
    svg.append(c); return c;
  });
  const hit=mk('rect',{x:P.l,y:P.t,width:W-P.l-P.r,height:H-P.t-P.b,fill:'transparent'});
  hit.style.cursor='crosshair'; svg.append(hit);
  const leer=(ev)=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    const x=op.x.min+(px-P.l)/(W-P.l-P.r)*(op.x.max-op.x.min);
    if(x<op.x.min||x>op.x.max) return;
    cruz.setAttribute('x1',X(x)); cruz.setAttribute('x2',X(x)); cruz.setAttribute('opacity','.5');
    const filas=op.series.map((s,i)=>{
      const y=s.f(x);
      if(isFinite(y)&&y>=op.y.min&&y<=op.y.max){
        puntos[i].setAttribute('cx',X(x)); puntos[i].setAttribute('cy',Y(y));
        puntos[i].setAttribute('fill',cssv(s.color)); puntos[i].setAttribute('opacity','1');
      } else puntos[i].setAttribute('opacity','0');
      return `<div style="display:flex;justify-content:space-between;gap:14px">
        <span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cssv(s.color)};margin-right:6px"></i>${esc(s.nombre)}</span>
        <b style="font-variant-numeric:tabular-nums">${isFinite(y)?y.toFixed(1):'—'}</b></div>`;
    }).join('');
    showTip(ev,`<div class="tiny" style="margin-bottom:5px;color:var(--ink-3)">${esc(op.x.label)} = <b style="color:var(--ink-1)">${x.toFixed(1)}</b></div>${filas}${op.nota?`<div class="tiny" style="margin-top:6px;color:var(--ink-3)">${op.nota(x)}</div>`:''}`);
  };
  hit.addEventListener('mousemove',leer);
  hit.addEventListener('mouseleave',()=>{
    hideTip(); cruz.setAttribute('opacity','0'); puntos.forEach(p=>p.setAttribute('opacity','0'));
  });

  cont.append(svg);

  // Leyenda: siempre presente cuando hay dos o más curvas
  if(op.series.length>1){
    const lg=el('div','legend'); lg.style.marginTop='8px';
    op.series.forEach(s=>lg.append(el('span','',
      `<i class="swatch" style="background:${cssv(s.color)}"></i>${esc(s.nombre)} <span class="muted">${esc(s.desc||'')}</span>`)));
    cont.append(lg);
  }
  return cont;
}

    'Cada llamada queda anotada en _hub/datos/ia-log.json. Ingeniería de Software III exige declarar en decisiones.md qué hiciste con IA: este registro es la evidencia.'));
