/* =========================================================================
   Repaso espaciado

   Las tarjetas no se guardan en ningún lado: son los bloques "## En el parcial"
   que ya están escritos en las notas. Lo único que persiste es el calendario.
   ========================================================================= */

const NOTAS_REPASO = [
  {n:0, txt:'No me salió',  tecla:'1', color:'--crit'},
  {n:1, txt:'Me costó',     tecla:'2', color:'--serious'},
  {n:2, txt:'Bien',         tecla:'3', color:'--warn'},
  {n:3, txt:'Fácil',        tecla:'4', color:'--good'},
];

async function viewRepaso(){
  const m=$('#main'); m.innerHTML='<div class="empty">Cargando…</div>';
  const d=await api('/api/repaso');
  S.repaso={...d, i:0, revelado:false, hechas:0};
  pintarRepaso();
}

function pintarRepaso(){
  const R=S.repaso, m=$('#main'); m.innerHTML='';

  const head=el('div','head');
  head.append(el('div','',`<h1>Repaso</h1><div class="sub">${
    R.resumen.totalTarjetas} tarjetas en el vault · salen de los bloques <span class="mono">## En el parcial</span></div>`));
  const acts=el('div','row');
  const bR=el('button','btn sm','Reiniciar el calendario');
  bR.onclick=async()=>{
    if(!confirm('Esto borra el historial de repaso (no toca ninguna nota). ¿Seguro?')) return;
    await api('/api/repaso',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({todo:true})});
    viewRepaso();
  };
  acts.append(bR); head.append(acts); m.append(head);

  /* --- Plan: la cuenta hacia atrás desde cada parcial --- */
  if(R.plan.length){
    const g=el('div','grid g3'); g.style.marginBottom='22px';
    R.plan.forEach(p=>{
      const c=el('div','tile');
      const col=matColor(p.materia);
      c.append(el('div','lbl',`<span class="dotk" style="background:${col};display:inline-block;margin-right:6px"></span>${esc(p.materia)}`));
      if(p.dias!=null){
        c.append(el('div','val',`${p.dias}<span class="hero-unit" style="font-size:14px">días</span>`));
        c.append(el('div','note',esc(p.examen.titulo.slice(0,54))));
      }else{
        c.append(el('div','val muted','—'));
        c.append(el('div','note','sin fecha de examen en el calendario'));
      }
      const barra=el('div','meter'); barra.style.margin='12px 0 7px';
      const i=el('i'); i.style.width=(p.total?p.vistas/p.total*100:0)+'%'; barra.append(i);
      c.append(barra);
      c.append(el('div','tiny muted',
        `${p.vistas} de ${p.total} vistas` +
        (p.porDia?` · <b style="color:var(--ink-1)">${p.porDia} nuevas por día</b> para llegar`:' · todas vistas')));
      if(p.alcanza===false)
        c.append(el('div','tiny','<span style="color:var(--crit)">No alcanza el ritmo: son demasiadas para los días que quedan.</span>'));
      g.append(c);
    });
    m.append(g);
  }

  /* --- Sesión --- */
  const cola=R.hoy;
  if(!cola.length){
    const done=el('div','card'); done.style.textAlign='center'; done.style.padding='44px 20px';
    if(R.resumen.hechasHoy){
      done.innerHTML=`<div style="font-size:40px;margin-bottom:10px">✓</div>
        <h2 style="margin-bottom:6px">Listo por hoy</h2>
        <div class="sec">${R.resumen.hechasHoy} tarjetas repasadas. Quedan ${R.resumen.nuevasRestantes} sin ver en total.</div>`;
    }else if(!R.resumen.totalTarjetas){
      done.innerHTML=`<h2>Todavía no hay tarjetas</h2>
        <div class="sec">Se arman solas con cada bloque <span class="mono">## En el parcial</span> que escribas en una nota.</div>`;
    }else{
      done.innerHTML=`<div style="font-size:40px;margin-bottom:10px">✓</div>
        <h2 style="margin-bottom:6px">Nada pendiente hoy</h2>
        <div class="sec">Volvé mañana: el calendario te va a traer lo que toque.</div>`;
    }
    m.append(done);
    return;
  }

  if(R.i>=cola.length){
    const done=el('div','card'); done.style.textAlign='center'; done.style.padding='44px 20px';
    done.innerHTML=`<div style="font-size:40px;margin-bottom:10px">✓</div>
      <h2 style="margin-bottom:6px">Terminaste la sesión</h2>
      <div class="sec">${R.hechas} tarjetas. Quedan ${Math.max(0,R.resumen.nuevasRestantes-R.hechas)} sin ver en el vault.</div>`;
    const b=el('button','btn primary','Volver a cargar'); b.style.marginTop='16px';
    b.onclick=()=>viewRepaso(); done.append(b);
    m.append(done);
    return;
  }

  const c=cola[R.i];
  const wrap=el('div'); wrap.style.cssText='max-width:760px;margin:0 auto';

  const prog=el('div','spread'); prog.style.marginBottom='12px';
  prog.append(el('div','tiny muted',`${R.i+1} de ${cola.length}`));
  const meta=el('div','row'); meta.style.gap='6px';
  meta.append(el('span','badge',esc(c.materia)));
  if(c.unidad) meta.append(el('span','badge',esc(c.unidad)));
  if(c.estado) meta.append(el('span','badge',`vista ${c.estado.vistas}× · vencía hace ${c.atraso}d`));
  else meta.append(el('span','badge','primera vez'));
  prog.append(meta);
  wrap.append(prog);

  const barra=el('div','meter'); barra.style.marginBottom='18px';
  const bi=el('i'); bi.style.width=(R.i/cola.length*100)+'%'; barra.append(bi);
  wrap.append(barra);

  const card=el('div','card'); card.style.padding='28px 30px';
  card.append(el('h1','',esc(c.titulo)));
  const cons=el('div'); cons.style.cssText='margin-top:16px;padding-left:15px;border-left:2.5px solid var(--m1)';
  cons.append(el('div','tiny muted','EN EL PARCIAL'));
  const ct=el('div','prose'); ct.style.cssText='margin-top:6px;font-size:15.5px';
  ct.innerHTML=renderMd(c.consigna); cons.append(ct);
  card.append(cons);

  if(!R.revelado){
    const hint=el('div','tiny muted'); hint.style.margin='22px 0 10px';
    hint.textContent='Respondelo en voz alta o en papel antes de mirar.';
    card.append(hint);
    const b=el('button','btn primary','Mostrar la nota');
    b.onclick=()=>{R.revelado=true;pintarRepaso();};
    card.append(b);
  }else{
    const hr=el('hr'); hr.style.cssText='border:none;border-top:1px solid var(--grid);margin:24px 0';
    card.append(hr);
    if(c.resumen){
      const r=el('div','prose'); r.style.fontSize='15.5px';
      r.innerHTML=renderMd('> '+c.resumen); card.append(r);
    }
    if(c.conexiones.length){
      card.append(el('div','tiny muted','CONEXIONES QUE TENÍAS QUE TRAER'));
      const ul=el('div','prose'); ul.style.cssText='margin-top:6px;font-size:14px';
      ul.innerHTML=renderMd(c.conexiones.map(x=>'- '+x).join('\n'));
      card.append(ul);
    }
    const abrir=el('button','btn sm','Abrir la nota completa →'); abrir.style.marginTop='6px';
    abrir.onclick=()=>go(`#/nota?rel=${encodeURIComponent(c.rel)}`);
    card.append(abrir);

    const grades=el('div','row'); grades.style.cssText='margin-top:24px;gap:8px';
    NOTAS_REPASO.forEach(g=>{
      const b=el('button','btn',`${g.txt} <span class="tiny muted" style="margin-left:5px">${g.tecla}</span>`);
      b.style.cssText=`border-color:color-mix(in oklab,var(${g.color}) 45%,transparent);flex:1`;
      b.onclick=()=>calificar(c.rel,g.n);
      grades.append(b);
    });
    card.append(grades);
    card.append(el('div','tiny muted','Teclas 1 a 4. Espacio muestra la nota.'));
  }
  wrap.append(card);
  m.append(wrap);
}

async function calificar(rel,nota){
  const R=S.repaso;
  try{
    await api('/api/repaso',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rel,nota})});
  }catch(e){ alert('No se pudo guardar: '+e.message); return; }
  R.hechas++; R.i++; R.revelado=false;
  pintarRepaso();
}

/* =========================================================================
   Cobertura: lo que pide el programa contra lo que hay escrito
   ========================================================================= */

const COB_LBL={nota:'Con nota',mencionado:'Solo mencionado',falta:'Sin cubrir',indeterminado:'—'};
const COB_COL={nota:'--good',mencionado:'--warn',falta:'--serious',indeterminado:'--ink-3'};

async function viewCobertura(){
  const m=$('#main'); m.innerHTML='<div class="empty">Cargando…</div>';
  const d=await api('/api/cobertura');
  m.innerHTML='';

  const head=el('div','head');
  head.append(el('div','',`<h1>Cobertura</h1>
    <div class="sub">Los temas que la cátedra dice que entran, contra las notas que existen.</div>`));
  m.append(head);

  const conProg=d.materias.filter(x=>!x.sinPrograma);
  const sinProg=d.materias.filter(x=>x.sinPrograma);

  if(!conProg.length){
    m.append(el('div','empty',`Ninguna materia tiene su programa cargado todavía.<br>
      <span class="tiny">Se lee de <span class="mono">&lt;Materia&gt;/00-Seguimiento/programa-&lt;sufijo&gt;.md</span>,
      con una tabla de Unidad | Tema.</span>`));
    return;
  }

  const sel=S.params.materia || conProg[0].materia;
  const chips=el('div','row'); chips.style.marginBottom='20px';
  conProg.forEach(x=>{
    const ch=el('button','chip'+(x.materia===sel?' on':''),
      `<span class="dotk" style="background:${matColor(x.materia)}"></span>${esc(x.materia)}`);
    ch.onclick=()=>go(`#/cobertura?materia=${encodeURIComponent(x.materia)}`);
    chips.append(ch);
  });
  m.append(chips);

  const c=conProg.find(x=>x.materia===sel)||conProg[0];

  const tiles=el('div','grid g3'); tiles.style.marginBottom='22px';
  tiles.append(tile('Temas del programa',String(c.total)));
  tiles.append(tile('Con nota propia',String(c.nota),`${Math.round(c.nota/c.total*100)}% del programa`));
  tiles.append(tile('Solo mencionados',String(c.mencionado),'aparecen en el texto, sin nota propia'));
  tiles.append(tile('Sin cubrir',String(c.falta),'ni nota ni mención'));
  m.append(tiles);

  const barra=el('div','card'); barra.style.marginBottom='22px';
  const st=el('div','stack');
  [['nota',c.nota],['mencionado',c.mencionado],['falta',c.falta]].forEach(([k,v])=>{
    if(!v) return;
    const i=el('i'); i.style.width=(v/c.total*100)+'%'; i.style.background=`var(${COB_COL[k]})`;
    bindTip(i,`<b>${COB_LBL[k]}</b><br>${v} de ${c.total} temas (${Math.round(v/c.total*100)}%)`);
    st.append(i);
  });
  barra.append(st);
  const lg=el('div','legend');
  [['nota',c.nota],['mencionado',c.mencionado],['falta',c.falta]].forEach(([k,v])=>{
    lg.append(el('span','',`<i class="swatch" style="background:var(${COB_COL[k]})"></i>${COB_LBL[k]} <b style="color:var(--ink-1)">${v}</b>`));
  });
  barra.append(lg);
  barra.append(el('div','tiny muted',`Fuente: <span class="mono">${esc(c.programa)}</span>. El matching es por palabras, no es infalible: la columna <b>Nota</b> de ese archivo es el override manual.`));
  m.append(barra);

  c.unidades.forEach(u=>{
    const total=u.temas.length;
    const card=el('div','card'); card.style.marginBottom='12px';
    const cab=el('div','spread'); cab.style.cursor='pointer';
    const izq=el('div');
    izq.append(el('h2','',`${esc(u.unidad)} <span class="muted" style="font-weight:400">· ${total} temas</span>`));
    cab.append(izq);
    const der=el('div','row'); der.style.gap='14px';
    const mini=el('div','stack'); mini.style.cssText='width:170px;height:10px';
    [['nota',u.nota],['mencionado',u.mencionado],['falta',u.falta]].forEach(([k,v])=>{
      if(!v) return;
      const i=el('i'); i.style.width=(v/total*100)+'%'; i.style.background=`var(${COB_COL[k]})`; mini.append(i);
    });
    der.append(mini);
    der.append(el('span','tiny muted',`${u.nota}/${total}`));
    const flecha=el('span','muted','▾');
    der.append(flecha); cab.append(der);
    card.append(cab);

    const cuerpo=el('div'); cuerpo.style.display='none'; cuerpo.style.marginTop='14px';
    const tb=el('table');
    tb.innerHTML='<thead><tr><th>Tema</th><th style="width:130px">Estado</th><th style="width:34%">Nota que lo cubre</th><th style="width:90px"></th></tr></thead>';
    const tbody=el('tbody');
    u.temas.forEach(t=>{
      const tr=el('tr');
      tr.append(el('td','',esc(t.tema)));
      tr.append(el('td','',`<span class="dotk" style="background:var(${COB_COL[t.estado]});display:inline-block;margin-right:7px"></span><span class="tiny">${COB_LBL[t.estado]}</span>`));
      const td=el('td');
      if(t.rel){
        const a=el('a','wl',esc(t.titulo));
        a.href=`#/nota?rel=${encodeURIComponent(t.rel)}`;
        td.append(a);
        if(t.score!=null&&t.score<1) td.append(el('span','tiny muted',` ${Math.round(t.score*100)}%`));
      }else td.append(el('span','muted','—'));
      if(t.candidatos&&t.candidatos.length){
        const alt=el('div','tiny muted'); alt.style.marginTop='3px';
        alt.textContent='o quizá: '+t.candidatos.map(x=>x.titulo).join(' · ');
        td.append(alt);
      }
      tr.append(td);
      const acc=el('td');
      if(t.estado==='falta'||t.estado==='mencionado'){
        const b=el('button','btn sm','Crear');
        b.onclick=()=>go(`#/nueva?materia=${encodeURIComponent(c.materia)}&titulo=${encodeURIComponent(t.tema)}&unidad=${encodeURIComponent(u.unidad)}&tipo=concepto`);
        acc.append(b);
      }
      tr.append(acc);
      tbody.append(tr);
    });
    tb.append(tbody); cuerpo.append(tb); card.append(cuerpo);
    cab.onclick=()=>{
      const abierto=cuerpo.style.display!=='none';
      cuerpo.style.display=abierto?'none':'block';
      flecha.textContent=abierto?'▾':'▴';
    };
    m.append(card);
  });

  if(sinProg.length){
    const av=el('div','card'); av.style.marginTop='18px';
    av.append(el('h3','','Materias sin programa cargado'));
    av.append(el('div','sec tiny',
      sinProg.map(x=>esc(x.materia)).join(' · ')+
      `<br><br>Para que aparezcan acá hace falta un archivo <span class="mono">&lt;Materia&gt;/00-Seguimiento/programa-&lt;sufijo&gt;.md</span> con una tabla de <b>Unidad | Tema</b> (una fila por tema). No se inventa: sale del programa de la cátedra.`));
    m.append(av);
  }
}

async function viewCapturar(){
  const m=$('#main'); m.innerHTML='';
  const rel=S.params.rel;
  if(!rel){ pantallaInicioCaptura(m); return; }

  const d=await api('/api/nota?rel='+encodeURIComponent(rel));
  document.body.classList.add('foco');

  const barra=el('div','cap-bar');
  const izq=el('div','row'); izq.style.gap='8px';
  izq.append(el('span','badge',esc(d.fm?.materia||'')));
  izq.append(el('span','tiny muted',esc(rel.split('/').pop().replace(/\.md$/,''))));
  const estado=el('span','tiny muted'); estado.textContent='guardado';
  izq.append(estado);
  barra.append(izq);

  const der=el('div','row'); der.style.gap='6px';
  const bHora=el('button','btn sm','Marcar hora');
  const bList=el('button','btn sm','Terminar');
  const bOrd=el('button','btn primary sm','Terminar y ordenar');
  der.append(bHora,bList,bOrd);
  barra.append(der);
  m.append(barra);

  // La cabecera (frontmatter + H1 + marca de captura) NO se muestra: el punto
  // de esta pantalla es una hoja en blanco. Se vuelve a pegar al guardar.
  const corte=d.contenido.indexOf(MARCA_CAPTURA);
  let cabecera, cuerpo;
  if(corte>=0){
    const fin=d.contenido.indexOf('\n',corte+MARCA_CAPTURA.length);
    cabecera=d.contenido.slice(0,fin<0?d.contenido.length:fin+1);
    cuerpo=d.contenido.slice(fin<0?d.contenido.length:fin+1).replace(/^\n+/,'');
  }else{
    // Nota que no nació como captura: se edita entera, sin esconder nada.
    cabecera=''; cuerpo=d.contenido;
  }

  const ta=el('textarea','cap-ta');
  ta.value=cuerpo;
  ta.spellcheck=false;
  ta.placeholder='Escribí sin pensar en el formato. Después lo ordena Claude.';
  m.append(ta);

  const pie=el('div','cap-pie');
  const cuenta=el('span','tiny muted');
  pie.append(cuenta);
  pie.append(el('span','tiny muted',
    (cabecera?'El frontmatter está guardado, no se muestra. ':'')+'⌘S guarda · ⌘T marca la hora · Esc sale del modo foco'));
  m.append(pie);

  const completo=()=>cabecera+(cabecera?'\n':'')+ta.value;
  const contar=()=>{
    cuenta.textContent=`${ta.value.split(/\s+/).filter(Boolean).length} palabras`;
  };
  contar();

  let t=null, guardando=false, sucio=false;
  const guardar=async()=>{
    if(guardando){ sucio=true; return; }
    guardando=true; sucio=false;
    estado.textContent='guardando…';
    try{
      await api('/api/nota',{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rel,contenido:completo()})});
      estado.textContent='guardado '+new Date().toTimeString().slice(0,5);
      estado.style.color='';
    }catch(e){
      estado.textContent='no se pudo guardar: '+e.message;
      estado.style.color='var(--crit)';
    }
    guardando=false;
    if(sucio) guardar();
  };
  ta.addEventListener('input',()=>{
    contar();
    estado.textContent='sin guardar';
    clearTimeout(t); t=setTimeout(guardar,1200);
  });
  ta.addEventListener('blur',()=>{clearTimeout(t);guardar();});

  const marcarHora=()=>{
    const h=new Date().toTimeString().slice(0,5);
    const s=ta.selectionStart;
    const antes=ta.value.slice(0,s), desp=ta.value.slice(ta.selectionEnd);
    const nl=antes.endsWith('\n')||!antes?'':'\n\n';
    const txt=`${nl}${h} · `;
    ta.value=antes+txt+desp;
    ta.selectionStart=ta.selectionEnd=s+txt.length;
    ta.focus(); contar();
    clearTimeout(t); t=setTimeout(guardar,1200);
  };
  bHora.onclick=marcarHora;
  bList.onclick=async()=>{ await guardar(); salirFoco(); go(`#/nota?rel=${encodeURIComponent(rel)}`); };
  bOrd.onclick=async()=>{ await guardar(); salirFoco(); go(`#/editar?rel=${encodeURIComponent(rel)}&ordenar=1`); };

  const teclas=e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();clearTimeout(t);guardar();}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='t'){e.preventDefault();marcarHora();}
  };
  ta.addEventListener('keydown',teclas);
  S.capturaCleanup=()=>{clearTimeout(t); if(ta.value) guardar();};
  setTimeout(()=>{ta.focus(); ta.selectionStart=ta.selectionEnd=ta.value.length;},40);
}

/* =========================================================================
   Ingesta: de un PDF de cátedra a un borrador de notas
   El PDF se lee en el navegador con pdf.js. Al servidor sólo va el texto.
   ========================================================================= */

let pdfjsLib=null;
async function cargarPdfJs(){
  if(pdfjsLib) return pdfjsLib;
  pdfjsLib=await import('/vendor/pdf.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.mjs';
  return pdfjsLib;
}

async function textoDePdf(file,onProgreso){
  const lib=await cargarPdfJs();
  const buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:buf}).promise;
  const partes=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p);
    const tc=await pg.getTextContent();
    // pdf.js entrega fragmentos sueltos: se reconstruyen las líneas por su Y.
    let linea=[], yAnt=null, buf2=[];
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(yAnt!==null && Math.abs(y-yAnt)>3){ buf2.push(linea.join('')); linea=[]; }
      linea.push(it.str); yAnt=y;
      if(it.hasEOL) { buf2.push(linea.join('')); linea=[]; yAnt=null; }
    }
    if(linea.length) buf2.push(linea.join(''));
    partes.push(buf2.join('\n'));
    if(onProgreso) onProgreso(p,doc.numPages);
  }
  return {texto:partes.join('\n\n'), paginas:doc.numPages};
}

    const avisos=[];
    if(p.existe) avisos.push(['bad',`Ya existe un archivo en <span class="mono">${esc(p.rel)}</span>. No se va a pisar.`]);
    if(p.colision) avisos.push(['bad',`El nombre <b>${esc(p.stem)}</b> ya está usado por ${esc(p.colision)}. Obsidian resuelve los wikilinks por nombre de archivo: serían el mismo destino. Cambiale el nombre antes de escribirla.`]);
    if(p.enlaces_rotos.length) avisos.push(['warn',`Enlaza a notas que no existen: ${p.enlaces_rotos.map(esc).join(' · ')}`]);
    avisos.forEach(([k,t])=>{ const a=el('div','alert '+k,t); a.style.marginTop='10px'; c.append(a); });

    const prev=el('div'); prev.style.display='none'; prev.style.marginTop='14px';
    const art=el('article','prose'); art.style.maxWidth='none';
    prev.append(art); c.append(prev);
    ver.onclick=()=>{
      const abierto=prev.style.display!=='none';
      prev.style.display=abierto?'none':'block';
      ver.textContent=abierto?'Ver':'Ocultar';
      if(!abierto&&!art.dataset.listo){
        art.innerHTML=renderMd(String(p.contenido).replace(/^---[\s\S]*?---\n/,''));
        enhance(art); art.dataset.listo='1';

    cont.append(c);

  if(r.descartados.length){
    const d=el('div','card'); d.style.marginTop='10px';

    r.descartados.forEach(x=>{const li=el('li'); li.textContent=x; ul.append(li);});
    d.append(ul); cont.append(d);
  }

  const fin=el('div','card'); fin.style.marginTop='14px';
  const b=el('button','btn primary','Escribir las notas elegidas');
  const res=el('div','tiny'); res.style.marginTop='10px';
  b.onclick=async()=>{
    const lista=r.propuestas.filter(p=>elegidas.has(p.stem)&&!p.existe&&!p.colision);
    if(!lista.length){ res.innerHTML='<span style="color:var(--crit)">No hay ninguna nota elegida que se pueda escribir.</span>'; return; }
    b.disabled=true; b.textContent='Escribiendo…';
    const ok=[],mal=[];
    for(const p of lista){
      try{
        await api('/api/nota',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({rel:p.rel,contenido:p.contenido})});
        ok.push(p.stem);
      }catch(e){ mal.push(`${p.stem}: ${e.message}`); }
    }
    await load(true);
    res.innerHTML=`<b>${ok.length} notas escritas.</b>`+(mal.length?`<br><span style="color:var(--crit)">${mal.map(esc).join('<br>')}</span>`:'')+
      `<br><span class="muted">Ninguna se guardó como definitiva: son notas normales, editalas desde el hub o desde Obsidian.</span>`;
    b.disabled=false; b.textContent='Escribir las notas elegidas';
  };
  fin.append(b,res);
  fin.append(el('div','tiny muted','Nada de esto pisa archivos existentes: si el nombre ya está ocupado, la nota queda sin escribir y te avisa arriba.'));
  cont.append(fin);
}

  zona.innerHTML='';
  const catedra=n.repos.filter(r=>r.rol==='catedra');
  if(!catedra.length) return;

  catedra.forEach(r=>{
    const c=el('div','card'); c.style.marginBottom='16px';
    const sp=el('div','spread');
    const izq=el('div');
    izq.append(el('h2','',`Novedades · ${esc(r.full_name)}`));
    if(r.ultimo) izq.append(el('div','tiny muted',`Último commit: ${fechaRel(r.ultimo.fecha)} — ${esc(r.ultimo.mensaje)}`));
    sp.append(izq);
    if(r.ultimo){
      const b=el('button','btn sm','Marcar todo como visto');
      b.onclick=async()=>{
        await api('/api/github/visto',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({full_name:r.full_name,sha:r.ultimo.sha})});
        const nn=await api('/api/github/novedades'); pintarNovedades(zona,nn);
      };
      sp.append(b);
    }

    if(r.primeraVez){
      c.append(el('div','alert warn','Primera vez que mirás este repo desde el hub. No te marco todo como novedad: acá abajo están los últimos commits. Apretá "marcar todo como visto" y de acá en adelante te aviso sólo lo nuevo.'));
      c.append(listaCommits(r.recientes, r.full_name));
    }else if(!r.nuevos.length){
      c.append(el('div','alert ok','Nada nuevo desde la última vez que miraste.'));
    }else{
      const av=el('div','alert warn');
      av.innerHTML=`<b>${r.nuevos.length} commit${r.nuevos.length===1?'':'s'} nuevo${r.nuevos.length===1?'':'s'}</b> desde la última vez.`;
      c.append(av);
      c.append(listaCommits(r.nuevos, r.full_name, true));

function listaCommits(commits, full_name, expandir){
  const cont=el('div'); cont.style.marginTop='12px';
  commits.forEach(cm=>{
    const fila=el('div'); fila.style.cssText='padding:10px 0;border-bottom:1px solid var(--grid)';
    const sp=el('div','spread');
    const izq=el('div');
    izq.append(el('div','',esc(cm.mensaje)));
    izq.append(el('div','tiny muted',`${esc(cm.autor)} · ${fechaRel(cm.fecha)} · <span class="mono">${cm.corto}</span>`));
    sp.append(izq);
    const der=el('div','row'); der.style.gap='6px';
    const bV=el('button','btn sm','Qué tocó');
    const arch=el('div'); arch.style.display='none'; arch.style.marginTop='8px';
    bV.onclick=async()=>{
      if(arch.dataset.listo){ arch.style.display=arch.style.display==='none'?'block':'none'; return; }
      bV.textContent='…';
      try{
        const r=await api(`/api/github/commit?full_name=${encodeURIComponent(full_name)}&sha=${encodeURIComponent(cm.sha||cm.corto)}`);
        arch.innerHTML='';
        r.archivos.forEach(a=>{
          const l=el('div','tiny');
          const col=a.estado==='added'?'var(--good)':a.estado==='removed'?'var(--crit)':'var(--ink-3)';
          l.innerHTML=`<span style="color:${col}">●</span> <span class="mono">${esc(a.ruta)}</span>
            <span class="muted">+${a.mas} −${a.menos}</span>`;
          arch.append(l);
        });
        if(!r.archivos.length) arch.append(el('div','tiny muted','sin archivos'));
        arch.dataset.listo='1'; arch.style.display='block';
      }catch(e){ arch.textContent=e.message; arch.style.display='block'; }
      bV.textContent='Qué tocó';
    };
    der.append(bV);
    if(cm.url&&cm.url!=='#'){ const a=el('a','btn sm','GitHub ↗'); a.href=cm.url; a.target='_blank'; der.append(a); }
    sp.append(der);
    fila.append(sp,arch);
    cont.append(fila);
  });
  return cont;
}

function fechaRel(iso){
  if(!iso) return '—';
  const d=new Date(iso), h=(Date.now()-d)/3600000;
  if(h<1) return 'hace minutos';
  if(h<24) return `hace ${Math.round(h)} h`;
  const dd=Math.round(h/24);
  if(dd<30) return `hace ${dd} día${dd===1?'':'s'}`;
  return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});
}

/* ---------- La matriz ----------
   Rampa secuencial de un solo tono, validada con el validador de dataviz en las
   dos superficies del hub: monótona en L, saltos >= 0.06, y el paso más claro
   despega de la superficie (2.00:1 en claro, 2.12:1 en oscuro).
*/

function pintarActividad(zona, a){
  zona.innerHTML='';
  const c=el('div','card'); c.style.marginBottom='16px';

  const sp=el('div','spread');
  const izq=el('div');
  izq.append(el('h2','','Actividad'));
  izq.append(el('div','tiny muted', a.origen==='contribuciones'
    ? `Calendario de contribuciones de <b>${esc(a.usuario)}</b> · ${a.total.toLocaleString('es-AR')} en el último año`
    : `Commits en los repos vinculados (${(a.repos||[]).map(esc).join(', ')}). <b>No es</b> el calendario de contribuciones de GitHub: para eso hace falta un token con <span class="mono">read:user</span>.`));
  sp.append(izq);
  const bTabla=el('button','btn sm','Ver como tabla');
  sp.append(bTabla);
  c.append(sp);

  // Umbrales por cuartiles de los días con actividad: se adapta a tu volumen
  // en vez de fijar "10 commits = verde oscuro" para cualquiera.
  const nz=a.dias.filter(d=>d.n>0).map(d=>d.n).sort((x,y)=>x-y);
  const q=(p)=>nz.length?nz[Math.min(nz.length-1,Math.floor(nz.length*p))]:1;
  const cortes=[q(0.25),q(0.5),q(0.75)];
  const nivel=(n)=>n===0?0:n<=cortes[0]?1:n<=cortes[1]?2:n<=cortes[2]?3:4;

  const grid=el('div','gh-grid');
  const dias=a.dias.slice();
  // Alinear a domingo para que cada columna sea una semana.
  const primera=new Date(dias[0].fecha+'T00:00:00');
  for(let i=0;i<primera.getDay();i++) dias.unshift({fecha:null,n:null});

  const cols=Math.ceil(dias.length/7);
  const wrap=el('div','gh-wrap');

  // Etiquetas de mes
  const meses=el('div','gh-meses');
  meses.style.gridTemplateColumns=`repeat(${cols}, 13px)`;
  let ultimoMes=-1;
  for(let col=0;col<cols;col++){
    const d=dias[col*7]?.fecha||dias[col*7+6]?.fecha;
    const et=el('span');
    if(d){ const mes=new Date(d+'T00:00:00').getMonth();
      if(mes!==ultimoMes){ et.textContent=MESES[mes]; ultimoMes=mes; } }
    meses.append(et);
  }

  const cuerpo=el('div','gh-cuerpo');
  const dows=el('div','gh-dows');
  DOW.forEach(d=>dows.append(el('span','',d)));
  grid.style.gridTemplateColumns=`repeat(${cols}, 13px)`;
  for(let col=0;col<cols;col++){
    for(let fila=0;fila<7;fila++){
      const d=dias[col*7+fila];
      const cel=el('i','gh-cel');
      cel.style.gridColumn=col+1; cel.style.gridRow=fila+1;
      if(!d||d.fecha===null){ cel.style.visibility='hidden'; grid.append(cel); continue; }
      const nv=nivel(d.n);
      cel.dataset.n=nv;
      bindTip(cel, `<b>${d.n} commit${d.n===1?'':'s'}</b><br>${new Date(d.fecha+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}`);
      grid.append(cel);
    }
  }
  cuerpo.append(dows,grid);
  wrap.append(meses,cuerpo);
  c.append(wrap);

  const pie=el('div','spread'); pie.style.marginTop='12px';
  const leyenda=el('div','row'); leyenda.style.gap='4px';
  leyenda.append(el('span','tiny muted','menos'));
  [0,1,2,3,4].forEach(n=>{ const i=el('i','gh-cel'); i.dataset.n=n; leyenda.append(i); });
  leyenda.append(el('span','tiny muted','más'));
  pie.append(leyenda);
  pie.append(el('span','tiny muted',`cortes: 1–${cortes[0]} · ${cortes[0]+1}–${cortes[1]} · ${cortes[1]+1}–${cortes[2]} · ${cortes[2]+1}+`));
  c.append(pie);

  // Vista de tabla: la alternativa que no depende del color.
  const tabla=el('div'); tabla.style.display='none'; tabla.style.marginTop='14px';
  const porMes=new Map();
  a.dias.forEach(d=>{ const k=d.fecha.slice(0,7); porMes.set(k,(porMes.get(k)||0)+d.n); });
  const t=el('table');
  t.innerHTML='<thead><tr><th>Mes</th><th class="num">Commits</th><th class="num">Días activos</th></tr></thead>';
  const tb=el('tbody');
  [...porMes.entries()].reverse().forEach(([k,v])=>{
    const act=a.dias.filter(d=>d.fecha.startsWith(k)&&d.n>0).length;
    const tr=el('tr');
    const [y,mm]=k.split('-');
    tr.append(el('td','',`${MESES[Number(mm)-1]} ${y}`));
    tr.append(el('td','num',String(v)));
    tr.append(el('td','num',String(act)));
    tb.append(tr);
  });
  t.append(tb); tabla.append(t); c.append(tabla);
  bTabla.onclick=()=>{
    const abierto=tabla.style.display!=='none';
    tabla.style.display=abierto?'none':'block';
    bTabla.textContent=abierto?'Ver como tabla':'Ocultar tabla';
  };

  // La regla de la materia, medida.
  const semanas=new Map();
  a.dias.forEach(d=>{ const dt=new Date(d.fecha+'T00:00:00');
    const lunes=new Date(dt); lunes.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=ymdCliente(lunes); semanas.set(k,(semanas.get(k)||0)+d.n); });
  const ult=[...semanas.entries()].slice(-8);
  const vacias=ult.filter(([,v])=>v===0).length;
  if(ult.length>=4){
    const nota=el('div','tiny'); nota.style.marginTop='10px';
    nota.innerHTML=vacias>=3
      ? `<span style="color:var(--warn)">⚠︎ ${vacias} de las últimas ${ult.length} semanas sin un solo commit.</span> Ingeniería de Software III se aprueba trabajando todas las semanas — la cátedra lo dice así: "está diseñada para que se acumule mal si no".`
      : `Semanas con actividad: <b>${ult.length-vacias} de las últimas ${ult.length}</b>. La materia se aprueba trabajando todas las semanas.`;
    c.append(nota);
  }

  zona.append(c);
}

function ymdCliente(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* =========================================================================
   Asistente

   Chat sobre el vault. El agente lee los archivos por su cuenta — no hay que
   armarle el contexto a mano. Lo que NO puede es escribir: cuando quiere
   cambiar algo lo propone, el hub lo muestra como diff y vos aceptás.
   ========================================================================= */

/* =========================================================================
   Contexto: qué está mirando Agustín ahora mismo

   Es lo que hace que el asistente sirva desde cualquier pantalla. No le mando
   "está en la vista X": le mando la ruta exacta del archivo, la materia, los
   números que tiene delante y qué suele necesitar alguien parado ahí.
   ========================================================================= */

async function contextoDeVista(){
  const v=S.view, p=S.params||{};
  const partes=[];
  const N=(rel)=>(S.data?.notas||[]).find(n=>n.rel===rel);

  if(v==='nota'||v==='editar'){
    const n=N(p.rel);
    partes.push(`Está ${v==='editar'?'EDITANDO':'leyendo'} la nota \`${p.rel}\`.`);
    if(n) partes.push(`Es de ${n.materia}, tipo ${n.tipo||'—'}${n.unidad?', unidad '+n.unidad:''}, estado ${n.estado||'sin estado'}, ${n.palabras} palabras, ${n.enlaces} wikilinks.`);
    partes.push('Si le pide algo sobre "esta nota" o "acá", es ese archivo. Leelo antes de contestar.');
  }
  else if(v==='materia'){
    const m=(S.data?.materias||[]).find(x=>x.id===p.id);
    partes.push(`Está en la materia ${p.id}.`);
    if(m) partes.push(`${m.total} notas · ${m.conteo.pendiente} pendientes, ${m.conteo.borrador} en borrador, ${m.conteo.estudiado} estudiadas, ${m.conteo.dominado} dominadas.`);
    partes.push(`El contexto de esa materia está en \`${p.id}/CLAUDE.md\`.`);
  }
  else if(v==='cobertura'){
    partes.push(`Está en Cobertura${p.materia?' de '+p.materia:''}: los temas del programa contra las notas que existen.`);
    partes.push(`El programa sale de \`${p.materia||'<Materia>'}/00-Seguimiento/programa-*.md\`. Lo que suele querer acá es que le escribas las notas que faltan, o que le digas cuáles priorizar para el parcial.`);
  }
  else if(v==='repaso'){
    const r=S.repaso;
    partes.push('Está en Repaso, la sesión de tarjetas.');
    if(r?.resumen) partes.push(`${r.resumen.pendientes} pendientes de ${r.resumen.totalTarjetas} tarjetas.`);
    if(r?.hoy?.[r.i]) partes.push(`La tarjeta que tiene delante es \`${r.hoy[r.i].rel}\`.`);
    partes.push('Acá suele querer que le tomes la lección: preguntale de a una y corregile.');
  }
  else if(v==='salud'){
    partes.push('Está en Salud: el validador de Convenciones.md.');
    partes.push('Lo que suele querer es que arregles lo que está roto: wikilinks a notas inexistentes, conceptos con menos de 3 conexiones, estados fuera de convención.');
  }
  else if(v==='codigo'){
    partes.push('Está en Código, la vista de GitHub.');
    partes.push('Los repos vinculados y el checklist de entregables de Ingeniería de Software III se ven ahí.');
  }
  else if(v==='calendario') partes.push('Está en el Calendario. Las fechas salen de las tablas de 00-Seguimiento/.');
  else if(v==='capturar') partes.push('Está capturando notas de clase a mano alzada. Probablemente quiera que le ordenes lo que acaba de escribir.');
  else if(v==='notas') partes.push('Está en el índice de notas.');
  else if(v==='hub') partes.push('Está en el Hub, la pantalla de inicio.');

  // Materia en foco: sirve para desambiguar "el parcial", "la unidad 3", etc.
  const mat = p.id || p.materia || (p.rel ? String(p.rel).split('/')[0] : null);
  if(mat && (S.data?.materias||[]).some(x=>x.id===mat)) partes.push(`Materia en foco: ${mat}.`);

  return partes.join(' ');
}

/* =========================================================================
   Panel del asistente

   Vive a la derecha, fuera de #main, así sobrevive a los cambios de vista y
   te acompaña donde estés. El estado de la conversación no se pierde al
   navegar — de hecho navegar es parte de la conversación.
   ========================================================================= */

const AG = { sesion:null, mensajes:[], corriendo:false, costo:0, turnos:0, modo:'propuesta', abierto:false, est:null };

const ICONO_TOOL = { Read:'▤', Glob:'⌸', Grep:'⌕', Write:'✎', Edit:'✎', MultiEdit:'✎', WebFetch:'⇱', Task:'⁂' };

/** Primera oración, sin cortar en extensiones de archivo. */
function primeraOracion(t){
  const m=String(t||'').match(/^.*?[.](?=\s|$)/);
  return m ? m[0] : String(t||'');
}

function togglePanel(forzar){
  AG.abierto = forzar!=null ? forzar : !AG.abierto;
  document.body.classList.toggle('con-panel', AG.abierto);
  localStorage.setItem('hub-panel', AG.abierto?'1':'0');
  if(AG.abierto){
    pintarPanel();
    setTimeout(()=>$('#pan-input')?.focus(),60);
  }
}

async function pintarPanel(){
  const raiz=$('#panel'); if(!raiz) return;
  if(!AG.est){
    raiz.innerHTML='<div class="empty">Conectando…</div>';
    AG.est=await api('/api/agente/estado').catch(e=>({ok:false,error:e.message}));
  }
  const est=AG.est, g=est.git||{};
  if(!g.repo && AG.modo==='directo') AG.modo='propuesta';
  raiz.innerHTML='';

  /* --- cabecera --- */
  const cab=el('div','pan-cab');
  const t=el('div','row'); t.style.gap='7px';
  t.append(el('span','',`<b style="letter-spacing:-.01em">Asistente</b>`));
  if(AG.turnos) t.append(el('span','tiny muted',`~US$ ${AG.costo.toFixed(3)}`));
  cab.append(t);
  const bx=el('div','row'); bx.style.gap='4px';
  if(AG.mensajes.length){
    const bn=el('button','btn sm','Nueva');
    bn.onclick=()=>{AG.sesion=null;AG.mensajes=[];AG.costo=0;AG.turnos=0;pintarPanel();};
    bx.append(bn);
  }
  const bc=el('button','btn sm','✕'); bc.onclick=()=>togglePanel(false);
  bx.append(bc); cab.append(bx);
  raiz.append(cab);

  if(!est.ok){
    const c=el('div','pan-cuerpo');
    c.append(el('div','alert warn',`No encuentro el CLI de Claude Code: <span class="mono">${esc(est.error||'')}</span>`));
    c.append(el('div','tiny muted',`<p style="margin-top:10px">Se instala con <span class="mono">npm install -g @anthropic-ai/claude-code</span> y se loguea corriendo <span class="mono">claude</span> una vez en la terminal.</p>`));
    const b=el('button','btn sm','Reintentar'); b.style.marginTop='10px';
    b.onclick=async()=>{ AG.est=null; await api('/api/agente/estado?force=1').catch(()=>{}); pintarPanel(); };
    c.append(b); raiz.append(c);
    return;
  }

  /* --- modo --- */
  const modos=el('div','pan-modo');
  [['propuesta','Propone'],['directo','Escribe solo']].forEach(([v,txt])=>{
    const ch=el('button','chip'+(AG.modo===v?' on':''),txt);
    if(v==='directo'&&!g.repo) ch.style.opacity='.45';
    ch.onclick=async()=>{
      if(v==='directo'&&!g.repo){ go('#/ajustes'); togglePanel(false); return; }
      AG.modo=v; pintarPanel();
    };
    modos.append(ch);
  });
  if(AG.modo==='directo') modos.append(el('span','tiny',`<span style="color:var(--good)">git ${esc(g.head||'')}</span>`));
  raiz.append(modos);

  /* --- hilo --- */
  const hilo=el('div','pan-cuerpo'); hilo.id='pan-hilo';
  if(!AG.mensajes.length) hilo.append(await panelSugerencias());
  else AG.mensajes.forEach(msg=>hilo.append(pintarMensaje(msg)));
  raiz.append(hilo);

  /* --- entrada --- */
  const pie=el('div','pan-pie');
  const ctx=el('div','tiny muted','');
  ctx.id='pan-ctx';
  contextoDeVista().then(c=>{ ctx.textContent = c ? '◈ '+primeraOracion(c) : ''; });
  pie.append(ctx);
  const ta=el('textarea','pan-input'); ta.id='pan-input';
  ta.placeholder='Preguntá algo. Sabe dónde estás parado.';
  pie.append(ta);
  const fila=el('div','spread'); fila.style.marginTop='7px';
  fila.append(el('span','tiny muted','⌘↵ enviar'));
  const b=el('button','btn primary sm','Preguntar');
  fila.append(b); pie.append(fila);
  raiz.append(pie);

  const enviar=async()=>{
    const texto=ta.value.trim();
    if(!texto||AG.corriendo) return;
    ta.value=''; ta.disabled=true; b.disabled=true; AG.corriendo=true;
    const h=$('#pan-hilo'); if(!AG.mensajes.length) h.innerHTML='';
    const mio={rol:'yo',texto}; AG.mensajes.push(mio); h.append(pintarMensaje(mio));
    const suyo={rol:'agente',texto:'',tools:[],propuestas:[],pensando:true};
    AG.mensajes.push(suyo);
    let nodo=pintarMensaje(suyo); h.append(nodo);
    h.scrollTop=h.scrollHeight;
    try{ await correrTurno(texto, {texto: await contextoDeVista()}, suyo, nodo, h); }
    catch(e){ suyo.error=e.message; suyo.pensando=false; nodo.replaceWith(pintarMensaje(suyo)); }
    AG.corriendo=false; ta.disabled=false; b.disabled=false; ta.focus();
    pintarPanel();
  };
  b.onclick=enviar;
  ta.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();enviar();} });
  hilo.scrollTop=hilo.scrollHeight;
}

/* ---------- Un turno ---------- */

async function correrTurno(texto, donde, msg, nodo, cont){
  const r=await fetch('/api/agente',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:texto, sesion:AG.sesion, contexto:donde?donde.texto:null, modo:AG.modo})});
  if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error||r.statusText); }

  const reader=r.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  const repintar=()=>{ const n=pintarMensaje(msg); nodo.replaceWith(n); nodo=n; if(cont) cont.scrollTop=cont.scrollHeight; };
  let ultimo=0;

  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    let corte;
    while((corte=buf.indexOf('\n\n'))>=0){
      const bloque=buf.slice(0,corte); buf=buf.slice(corte+2);
      const mEv=bloque.match(/^event: (.+)$/m);
      const mD=bloque.match(/^data: ([\s\S]*)$/m);
      if(!mEv||!mD) continue;
      let dato; try{ dato=JSON.parse(mD[1]); }catch{ continue; }

      if(mEv[1]==='error'){ msg.error=dato.mensaje; msg.pensando=false; repintar(); continue; }

      if(mEv[1]==='fin'){
        msg.pensando=false;
        msg.propuestas=dato.propuestas||[];
        msg.escrituras=dato.escrituras||null;
        if(dato.code!==0 && !msg.texto) msg.error=dato.stderr||`El CLI salió con código ${dato.code}`;
        // El texto final ya no debe mostrar los bloques de escritura: se ven
        // como diff más abajo.
        msg.texto=msg.texto.replace(/```hub:escribir[\s\S]*?```/g,'').replace(/\n{3,}/g,'\n\n').trim();
        repintar();
        continue;
      }

      const ev=dato;
      if(ev.type==='system'&&ev.subtype==='init'){ msg.modelo=ev.model; AG.sesion=ev.session_id; }
      else if(ev.type==='stream_event'&&ev.event?.delta?.type==='text_delta'){
        msg.texto+=ev.event.delta.text; msg.pensando=false;
        if(Date.now()-ultimo>90){ ultimo=Date.now(); repintar(); }
      }
      else if(ev.type==='assistant'){
        (ev.message?.content||[]).forEach(b=>{
          if(b.type==='tool_use') msg.tools.push({id:b.id,nombre:b.name,input:b.input});
        });
        repintar();
      }
      else if(ev.type==='result'){
        AG.sesion=ev.session_id||AG.sesion;
        AG.costo+=ev.total_cost_usd||0; AG.turnos++;
        msg.uso=ev.usage; msg.costo=ev.total_cost_usd;
      }
      else if(ev.type==='system'&&ev.subtype==='api_retry'){
        msg.reintento=`reintentando (${ev.attempt}/${ev.max_retries}) — ${ev.error}`;
        repintar();
      }
    }
  }
  repintar();
}

/* ---------- Pintado ---------- */

function pintarMensaje(msg){
  const w=el('div'); w.style.marginBottom='16px';

  if(msg.rol==='yo'){
    const c=el('div');
    c.style.cssText='background:color-mix(in oklab,var(--m1) 12%,transparent);border-radius:12px;'+
      'padding:12px 15px;max-width:80%;margin-left:auto;white-space:pre-wrap';
    c.textContent=msg.texto;
    w.append(c);
    return w;
  }

  if(msg.tools?.length){
    const tl=el('div'); tl.style.cssText='display:flex;flex-direction:column;gap:3px;margin-bottom:10px';
    msg.tools.forEach(t=>{
      const f=el('div','tiny muted');
      f.style.cssText='display:flex;gap:8px;align-items:center';
      const arg=t.input?.file_path||t.input?.pattern||t.input?.path||'';
      f.innerHTML=`<span style="opacity:.6">${ICONO_TOOL[t.nombre]||'·'}</span>
        <span>${esc(t.nombre)}</span><span class="mono" style="opacity:.75">${esc(String(arg).slice(0,70))}</span>`;
      tl.append(f);
    });
    w.append(tl);
  }

  if(msg.reintento) w.append(el('div','tiny',`<span style="color:var(--warn)">${esc(msg.reintento)}</span>`));

  if(msg.pensando && !msg.texto){
    const p=el('div','tiny muted','pensando…'); p.style.padding='4px 0'; w.append(p);
  }

  if(msg.texto){
    const art=el('article','prose'); art.style.cssText='max-width:none;font-size:14.5px';
    art.innerHTML=renderMd(msg.texto);
    enhance(art);
    w.append(art);
  }

  if(msg.error) w.append(el('div','alert bad',esc(msg.error)));

  (msg.propuestas||[]).forEach((p,i)=>w.append(pintarPropuesta(p,msg,i)));
  if(msg.escrituras) w.append(pintarEscrituras(msg.escrituras,msg));

  if(msg.costo!=null){
    const u=el('div','tiny muted'); u.style.marginTop='8px';
    u.textContent=`${msg.modelo||''} · ${msg.uso?`${msg.uso.input_tokens} entrada / ${msg.uso.output_tokens} salida · `:''}~US$ ${(msg.costo||0).toFixed(4)} estimado`;
    w.append(u);
  }
  return w;
}

function pintarPropuesta(p,msg,i){
  const c=el('div','card'); c.style.marginTop='12px';
  const sp=el('div','spread');
  const izq=el('div');
  izq.append(el('div','',`<b>${p.existe?'Modificar':'Crear'}</b> <span class="mono">${esc(p.rel)}</span>`));
  const lineas=p.contenido.split('\n').length;
  izq.append(el('div','tiny muted',`${lineas} líneas · ${p.contenido.split(/\s+/).filter(Boolean).length} palabras`));
  sp.append(izq);
  const der=el('div','row'); der.style.gap='6px';
  const bVer=el('button','btn sm','Ver diff');
  const bOk=el('button','btn primary sm', p.existe?'Aplicar':'Crear');
  der.append(bVer,bOk); sp.append(der);
  c.append(sp);

  const zona=el('div'); zona.style.cssText='display:none;margin-top:12px'; c.append(zona);
  bVer.onclick=()=>{
    const abierto=zona.style.display!=='none';
    zona.style.display=abierto?'none':'block';
    bVer.textContent=abierto?'Ver diff':'Ocultar';
    if(!abierto&&!zona.dataset.listo){
      zona.append(pintarDiff(p.actual||'', p.contenido));
      zona.dataset.listo='1';
    }
  };

  const msgOk=el('div','tiny'); msgOk.style.marginTop='8px'; c.append(msgOk);
  bOk.onclick=async()=>{
    bOk.disabled=true; msgOk.textContent='Escribiendo…'; msgOk.style.color='';
    try{
      await api('/api/nota',{method:p.existe?'PUT':'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rel:p.rel,contenido:p.contenido})});
      await load(true);
      msgOk.style.color='var(--good)';
      msgOk.innerHTML=`✓ Escrito. <a class="wl" href="#/nota?rel=${encodeURIComponent(p.rel)}">Abrir la nota</a>`;
      bOk.textContent='Hecho';
      p.aplicada=true;
    }catch(e){ msgOk.style.color='var(--crit)'; msgOk.textContent=e.message; bOk.disabled=false; }
  };
  if(p.aplicada){ bOk.disabled=true; bOk.textContent='Hecho'; }

  c.append(el('div','tiny muted','El asistente no tiene permiso de escritura. Este archivo lo escribe el hub, y sólo cuando apretás.'));
  return c;
}


/* ---------- Lo que el asistente escribió, y cómo deshacerlo ---------- */

function pintarEscrituras(esc_,msg){
  const c=el('div','card'); c.style.marginTop='12px';
  if(!esc_.archivos.length){
    c.append(el('div','tiny muted','No tocó ningún archivo en este turno.'));
    return c;
  }
  const sp=el('div','spread');
  const izq=el('div');
  izq.append(el('div','',`<b>Escribió ${esc_.archivos.length} archivo${esc_.archivos.length===1?'':'s'}</b>`));
  izq.append(el('div','tiny muted',`Punto de restauración: <span class="mono">${esc(esc_.desde)}</span>`));
  sp.append(izq);
  const bU=el('button','btn sm','Deshacer todo');
  bU.style.borderColor='color-mix(in oklab,var(--crit) 45%,transparent)';
  sp.append(bU); c.append(sp);

  const lista=el('div'); lista.style.marginTop='12px';
  esc_.archivos.forEach(a=>{
    const f=el('div'); f.style.cssText='padding:7px 0;border-bottom:1px solid var(--grid)';
    const sp2=el('div','spread');
    const col=a.estado==='nuevo'?'var(--good)':'var(--warn)';
    sp2.append(el('div','',`<span style="color:${col}">●</span>
      <span class="mono" style="font-size:12.5px">${esc(a.ruta)}</span>
      ${a.mas||a.menos?`<span class="tiny muted"> +${a.mas} −${a.menos}</span>`:`<span class="tiny muted"> ${esc(a.estado)}</span>`}`));
    const acc=el('div','row'); acc.style.gap='6px';
    const bD=el('button','btn sm','Ver cambio');
    const bA=el('a','btn sm','Abrir'); bA.href=`#/nota?rel=${encodeURIComponent(a.ruta)}`;
    acc.append(bD,bA); sp2.append(acc);
    const zona=el('div'); zona.style.cssText='display:none;margin-top:10px';
    bD.onclick=async()=>{
      const abierto=zona.style.display!=='none';
      zona.style.display=abierto?'none':'block';
      bD.textContent=abierto?'Ver cambio':'Ocultar';
      if(!abierto&&!zona.dataset.listo){
        zona.textContent='Cargando…';
        try{
          const d=await api(`/api/git/diff?sha=${encodeURIComponent(esc_.desde)}&ruta=${encodeURIComponent(a.ruta)}`);
          zona.innerHTML=''; zona.append(pintarDiff(d.antes||'', d.ahora||''));
        }catch(e){ zona.textContent=e.message; }
        zona.dataset.listo='1';
      }
    };
    f.append(sp2,zona); lista.append(f);
  });
  c.append(lista);

  const res=el('div','tiny'); res.style.marginTop='10px'; c.append(res);
  bU.onclick=async()=>{
    if(!confirm(`Volver el vault al punto ${esc_.desde}. Se pierde todo lo que el asistente escribió en este turno. ¿Seguro?`)) return;
    bU.disabled=true; res.textContent='Revirtiendo…';
    try{
      await api('/api/git/revertir',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({sha:esc_.desde})});
      await load(true);
      res.style.color='var(--good)';
      res.textContent='✓ Revertido. El vault volvió a como estaba antes del turno.';
      msg.escrituras=null;
    }catch(e){ res.style.color='var(--crit)'; res.textContent=e.message; bU.disabled=false; }
  };
  return c;
}

    };
    c.append(msg,b);
  }else{
    const t=el('div');
    t.innerHTML=`<div class="tiny muted">Último commit</div>

      <span class="tiny muted">${esc((g.ultimo.fecha||'').slice(0,16))}</span></div>`;
    c.append(t);

      c.append(el('div','alert ok','El árbol está limpio: no hay cambios sin guardar.'));
    }else{
      const a=el('div','alert warn');
      a.innerHTML=`<div><b>${g.cambios} archivos con cambios sin commitear.</b>
        <div class="tiny" style="margin-top:6px">${g.archivos.map(x=>`<span class="mono">${esc(x.ruta)}</span>`).join('<br>')}</div></div>`;
      c.append(a);
      const bC=el('button','btn'); bC.style.marginTop='12px'; bC.textContent='Guardar un punto ahora';
      const msg2=el('div','tiny'); msg2.style.marginTop='8px';
      bC.onclick=async()=>{
        bC.disabled=true;
        const r=await api('/api/git/checkpoint',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({motivo:'manual desde el hub'})});
        msg2.style.color='var(--good)'; msg2.textContent=`✓ Punto guardado: ${r.sha}`;
        setTimeout(()=>panelGit(),800);
      };
      c.append(bC,msg2);
    }
    c.append(el('div','tiny muted','Desde la terminal: <span class="mono">git log</span> para ver la historia y <span class="mono">git diff HEAD~1</span> para el último cambio. El hub sólo hace commits, nunca push.'));
  }
  const bv=el('button','btn'); bv.textContent='Volver'; bv.style.marginTop='14px';
  bv.onclick=()=>go('#/ajustes');
  c.append(bv);
  m.innerHTML=''; m.append(c);
}

const DRV = { carpeta:'root', ruta:[], q:'' };

const TAM = (n)=>{ n=Number(n||0); if(!n) return '—';
  const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<3){n/=1024;i++;}
  return n.toFixed(i?1:0)+' '+u[i]; };

function esCarpeta(f){ return f.mimeType==='application/vnd.google-apps.folder'; }
function esGoogleDoc(f){ return String(f.mimeType||'').startsWith('application/vnd.google-apps')&&!esCarpeta(f); }

async function viewDrive(){

  m.innerHTML='';

  head.append(el('div','',`<h1>Drive</h1>
    <div class="sub">${est.conectado?`Conectado como <b>${esc(est.cuenta||'—')}</b>`:'Bajá material de cátedra, publicá una unidad y hacé backup del vault'}</div>`));
  const acts=el('div','row');
  if(est.conectado){
    const bB=el('button','btn','Backup del vault'); bB.onclick=()=>panelBackup();
    const bP=el('button','btn','Publicar'); bP.onclick=()=>panelPublicar();
    const bD=el('button','btn sm','Desconectar');
    bD.onclick=async()=>{ if(!confirm('¿Desconectar Drive? Las credenciales quedan guardadas.'))return;
      await api('/api/drive/desconectar',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      viewDrive(); };
    acts.append(bB,bP,bD);
  }
  head.append(acts); m.append(head);

  if(!est.conectado){ m.append(panelConectarDrive(est)); return; }

/* ---------- Explorador ---------- */

function explorador(){
  const cont=el('div');

  const barra=el('div','row'); barra.style.marginBottom='12px';
  const iQ=el('input','input'); iQ.placeholder='Buscar en todo tu Drive…'; iQ.style.flex='1';
  iQ.value=DRV.q;
  const bQ=el('button','btn','Buscar');
  const bR=el('button','btn sm','Mi unidad');
  barra.append(iQ,bQ,bR); cont.append(barra);
  bQ.onclick=()=>{ DRV.q=iQ.value.trim(); DRV.carpeta='root'; cargar(); };
  iQ.addEventListener('keydown',e=>{ if(e.key==='Enter') bQ.onclick(); });
  bR.onclick=()=>{ DRV.q=''; iQ.value=''; DRV.carpeta='root'; cargar(); };

  const migas=el('div','row'); migas.style.cssText='gap:5px;margin-bottom:10px;font-size:13px';
  cont.append(migas);

  const card=el('div','card'); card.style.padding='6px'; cont.append(card);

  async function cargar(){
    card.innerHTML='<div class="empty">Leyendo Drive…</div>';
    migas.innerHTML='';
    let d;
    try{
      const p=new URLSearchParams();
      if(DRV.q) p.set('q',DRV.q); else p.set('carpeta',DRV.carpeta);
      d=await api('/api/drive/listar?'+p);
    }catch(e){ card.innerHTML=''; card.append(el('div','alert bad',esc(e.message))); return; }

    if(!DRV.q){
      const raiz=el('a','wl','Mi unidad'); raiz.href='javascript:void 0';
      raiz.onclick=()=>{DRV.carpeta='root';cargar();};
      migas.append(raiz);
      (d.ruta||[]).forEach(r=>{
        migas.append(el('span','muted','/'));
        const a=el('a','wl',esc(r.nombre)); a.href='javascript:void 0';
        a.onclick=()=>{DRV.carpeta=r.id;cargar();};
        migas.append(a);
      });
    }else migas.append(el('span','tiny muted',`Resultados para "${esc(DRV.q)}"`));

    card.innerHTML='';
    if(!d.archivos.length){ card.append(el('div','empty','Nada acá.')); return; }

    d.archivos.forEach(f=>{
      const fila=el('div','note-row'); fila.style.gridTemplateColumns='1fr auto';
      const izq=el('div');
      const ico=esCarpeta(f)?'▸':esGoogleDoc(f)?'◆':'▤';
      izq.innerHTML=`<div class="t">${ico} ${esc(f.name)}</div>
        <div class="x">${esCarpeta(f)?'carpeta':`${TAM(f.size)}${esGoogleDoc(f)?' · documento de Google':''}`} · ${
          f.modifiedTime?new Date(f.modifiedTime).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}):''}</div>`;
      fila.append(izq);
      const der=el('div','row'); der.style.gap='6px';
      if(esCarpeta(f)){
        fila.onclick=()=>{DRV.carpeta=f.id;DRV.q='';iQ.value='';cargar();};
      }else{
        const bB=el('button','btn sm','Bajar al vault');
        bB.onclick=(e)=>{ e.stopPropagation(); panelBajar(f); };
        der.append(bB);
      }
      if(f.webViewLink){
        const a=el('a','btn sm','↗'); a.href=f.webViewLink; a.target='_blank';
        a.onclick=e=>e.stopPropagation(); der.append(a);
      }
      fila.append(der);
      card.append(fila);
    });
    if(d.siguiente) card.append(el('div','tiny muted','Hay más archivos: afiná la búsqueda o entrá a una carpeta.'));
  }
  cargar();
  return cont;
}

function go(hash){ location.hash=hash; }

function parseHash(){
  const h=location.hash.replace(/^#\/?/,'')||'hub';
  const [name,qs]=h.split('?');
  const params={};
  new URLSearchParams(qs||'').forEach((v,k)=>params[k]=v);
  return {name:VIEWS[name]?name:'hub',params};
}

async function route(){
  const {name,params}=parseHash();
  // Salir de una captura: guardar lo pendiente y devolver la barra lateral.
  if(S.capturaCleanup && name!=='capturar'){ try{S.capturaCleanup();}catch(e){} S.capturaCleanup=null; }
  if(name!=='capturar') salirFoco();
  if(name!=='agente') S.paramsPrevios=params;
  S.view=name; S.params=params;
  buildNav();
  if(AG.abierto) setTimeout(()=>{
    const c=$('#pan-ctx');
    if(c) contextoDeVista().then(t=>{ c.textContent = t ? '◈ '+primeraOracion(t) : ''; });
    const h=$('#pan-hilo');
    if(h && !AG.mensajes.length) panelSugerencias().then(n=>{h.innerHTML='';h.append(n);});
  },30);
  window.scrollTo(0,0);
  try{ await VIEWS[name](); }
  catch(e){ $('#main').innerHTML=`<div class="empty">Error: ${esc(e.message)}</div>`; }
}

const omni=$('#omni'), omniQ=$('#omni-q'), omniRes=$('#omni-res');

function openOmni(){ omni.classList.add('on'); omniQ.value=''; omniQ.focus(); renderOmni(); }
function closeOmni(){ omni.classList.remove('on'); clearTimeout(omniT); }

/** Inserta un wikilink en el editor abierto, en la posición del cursor. */
function insertarEnlaceEnEditor(stem){
  const ta=S.editorActivo; if(!ta) return false;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const antes=ta.value.slice(0,s), despues=ta.value.slice(e);
  // Si el cursor ya estaba dentro de unos corchetes abiertos, no se duplican.
  const abierto=/\[\[[^\]\n]*$/.test(antes);
  const txt=abierto?stem+']]':`[[${stem}]]`;
  ta.value=antes+txt+despues;
  const pos=s+txt.length;
  ta.selectionStart=ta.selectionEnd=pos;
  ta.focus(); ta.dispatchEvent(new Event('input'));
  return true;
}

function pintarOmni(){
  // Cartel de modo: dentro del editor, ⌘K inserta en vez de navegar.
  const modo=$('#omni-modo');
  if(modo){
    if(S.editorActivo){
      modo.style.display='block';
      modo.innerHTML='Estás editando una nota: <b>Enter inserta el enlace</b> donde tenés el cursor · '+
        '<b>⌘↩</b> abre la nota en vez de insertarla';
    } else modo.style.display='none';
  }
  omniRes.innerHTML='';
  omniItems.forEach((it,i)=>{
    const r=el('div','r'+(i===omniSel?' sel':''));
    r.style.display='block';
    r.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
        <span>${it.tHtml||esc(it.t)}</span>
        <span class="tiny muted" style="flex:none">${esc(it.s)}</span></div>`+
      (it.frag?`<div class="tiny muted" style="margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.frag}</div>`:'');
    r.onclick=(ev)=>{
      if(S.editorActivo && it.stem && !(ev.metaKey||ev.ctrlKey)){ closeOmni(); insertarEnlaceEnEditor(it.stem); }
      else { closeOmni(); go(it.h); }
    };
    omniRes.append(r);
  });
  if(!omniItems.length) omniRes.innerHTML='<div class="r muted">Sin resultados</div>';
}

/** Resalta los términos buscados dentro de un texto ya escapado. */
function resaltar(texto,q){
  const term=q.trim().split(/\s+/).filter(t=>t.length>=2)
    .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!term.length) return esc(texto);
  let out=esc(texto);
  term.forEach(t=>{
    // Sin tildes de un lado y del otro para que "economia" pinte "Economía".
    const re=new RegExp('('+t.split('').map(c=>{
      const m={a:'aá',e:'eé',i:'ií',o:'oó',u:'uúü',n:'nñ',c:'cç'}[c.toLowerCase()];
      return m?`[${m}${m.toUpperCase()}]`:c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }).join('')+')','gi');
    out=out.replace(re,'<mark style="background:color-mix(in oklab,var(--m1) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px">$1</mark>');
  });
  return out;
}

const OMNI_IR=[{t:'Hub',s:'Ir',h:'#/hub'},{t:'Calendario',s:'Ir',h:'#/calendario'},
  {t:'Mapa de conceptos',s:'Ir',h:'#/grafo'},{t:'Salud del vault',s:'Ir',h:'#/salud'},
  {t:'Administrar materias',s:'Ir',h:'#/materias'},
  {t:'Ajustes y clave de API',s:'Ir',h:'#/ajustes'},
  {t:'Nueva nota',s:'Crear',h:'#/nueva'}];

function renderOmni(){
  const q=omniQ.value.trim();
  omniSel=0;
  if(!q){
    omniItems=S.editorActivo
      ? (S.data?.notas||[]).filter(n=>n.tipo==='concepto')
          .sort((a,b)=>b.mtime-a.mtime).slice(0,8)
          .map(n=>({t:n.titulo,s:(n.materia||'')+' · concepto',stem:n.stem,
            h:`#/nota?rel=${encodeURIComponent(n.rel)}`}))
      : OMNI_IR.map(x=>({...x}));
    pintarOmni();
    return;
  }
  // Respuesta inmediata por título mientras llega la búsqueda de contenido.
  omniItems=(S.data?.notas||[])
    .filter(n=>!n.rel.startsWith('00-Sistema/Plantillas/'))
    .filter(n=>normalizarCliente(n.titulo).includes(normalizarCliente(q)))
    .slice(0,8)
    .map(n=>({t:n.titulo,tHtml:resaltar(n.titulo,q),
      s:(n.materia||'')+' · '+(TIPO_LBL[n.tipo]||n.tipo||''),
      stem:n.stem,
      h:`#/nota?rel=${encodeURIComponent(n.rel)}&q=${encodeURIComponent(q)}`}));
  pintarOmni();

  clearTimeout(omniT);
  const mio=++omniSeq;
  omniT=setTimeout(async()=>{
    try{
      const r=await api('/api/buscar?q='+encodeURIComponent(q));
      if(mio!==omniSeq) return; // llegó una respuesta vieja
      omniItems=r.resultados.map(x=>({
        t:x.titulo, tHtml:resaltar(x.titulo,q),
        s:`${x.materia||'—'} · ${TIPO_LBL[x.tipo]||x.tipo||'nota'}`,
        frag:resaltar(x.fragmento||'',q), stem:x.stem,
        h:`#/nota?rel=${encodeURIComponent(x.rel)}&q=${encodeURIComponent(q)}`}));
      if(r.total>r.resultados.length)
        omniItems.push({t:`… y ${r.total-r.resultados.length} más`,s:'',h:'#/notas'});
      omniSel=0; pintarOmni();
    }catch(e){}
  },160);
}
function normalizarCliente(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

/** Pinta el término dentro de la nota ya renderizada y salta a la primera aparición. */
function marcarEnNota(raiz,q){
  const term=q.trim().split(/\s+/).filter(t=>t.length>=2).map(normalizarCliente);
  if(!term.length) return;
  const it=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT);
  const nodos=[]; let n;
  while((n=it.nextNode())) if(n.nodeValue.trim() && n.parentElement.tagName!=='MARK') nodos.push(n);
  let primero=null;
  nodos.forEach(nodo=>{
    const norm=normalizarCliente(nodo.nodeValue);
    let idx=-1, cual=null;
    term.forEach(t=>{ const i=norm.indexOf(t); if(i>=0 && (idx<0||i<idx)){ idx=i; cual=t; } });
    if(idx<0) return;
    const span=document.createElement('span');
    span.append(document.createTextNode(nodo.nodeValue.slice(0,idx)));
    const mk=document.createElement('mark');
    mk.style.cssText='background:color-mix(in oklab,var(--m1) 35%,transparent);color:inherit;border-radius:3px;padding:0 2px';
    mk.textContent=nodo.nodeValue.slice(idx,idx+cual.length);
    span.append(mk);
    span.append(document.createTextNode(nodo.nodeValue.slice(idx+cual.length)));
    nodo.parentNode.replaceChild(span,nodo);
    if(!primero) primero=mk;
  });
  if(primero) primero.scrollIntoView({block:'center',behavior:'smooth'});
}
omniQ.addEventListener('input',renderOmni);
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();togglePanel();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openOmni();return;}
  // Atajos de la sesión de repaso: espacio revela, 1 a 4 califican.
  if(S.view==='repaso' && !omni.classList.contains('on') && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)){
    const R=S.repaso;
    if(R && R.hoy && R.i<R.hoy.length){
      if(e.key===' '&&!R.revelado){e.preventDefault();R.revelado=true;pintarRepaso();return;}
      if(R.revelado&&['1','2','3','4'].includes(e.key)){e.preventDefault();calificar(R.hoy[R.i].rel,Number(e.key)-1);return;}
    }
  }
  if(e.key==='Escape'&&S.view==='capturar'&&document.body.classList.contains('foco')){ salirFoco(); return; }
  if(e.key==='Escape') closeOmni();
  if(!omni.classList.contains('on')) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    omniSel=Math.max(0,Math.min(omniItems.length-1,omniSel+(e.key==='ArrowDown'?1:-1)));
    [...omniRes.children].forEach((c,i)=>c.classList.toggle('sel',i===omniSel));
    omniRes.children[omniSel]?.scrollIntoView({block:'nearest'});
  }
  if(e.key==='Enter'&&omniItems[omniSel]){
    const it=omniItems[omniSel];
    if(S.editorActivo && it.stem && !(e.metaKey||e.ctrlKey)){
      closeOmni(); insertarEnlaceEnEditor(it.stem);
    } else { closeOmni(); go(it.h); }
  }
});
omni.addEventListener('click',e=>{if(e.target===omni)closeOmni();});

/* ---------- Arranque ---------- */
async function load(silent){
  S.data=await api('/api/estado');
  S.grafo=null;
  $('#foot-count').textContent=`${S.data.notas.length} notas indexadas`;
  if(!silent) S.salud=await api('/api/salud');
}

(async function init(){
  const saved=localStorage.getItem('hub-theme');
  if(saved) document.documentElement.dataset.theme=saved;
  try{
    await load();
  }catch(e){
    $('#main').innerHTML=`<div class="empty">No pude leer el vault.<br><span class="tiny">${esc(e.message)}</span></div>`;
    return;
  }
  addEventListener('hashchange',route);
  $('#fab').onclick=()=>togglePanel(true);
  if(localStorage.getItem('hub-panel')==='1') togglePanel(true);
  route();
})();
</script>
