# nginx del frontend.
#
# Dos trabajos: servir los archivos estáticos del hub, y mandar todo lo que
# empiece con /api al backend. El nombre `backend` lo resuelve el DNS interno
# de la red de compose — por eso no hay ninguna IP acá.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Las librerías vendorizadas no cambian nunca: se cachean fuerte.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # La API va al backend. `backend` es el nombre del servicio en compose y
    # 4177 el puerto donde escucha adentro del contenedor.
    location /api/ {
        proxy_pass http://backend:4177;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El asistente responde por SSE: sin esto nginx acumula la respuesta y
        # el streaming se ve de golpe al final, o directamente se corta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
