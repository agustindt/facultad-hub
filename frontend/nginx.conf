# Plantilla de nginx. La imagen oficial la procesa al ARRANCAR y reemplaza
# ${BACKEND_URL}. Esa dirección no está horneada: la misma imagen sirve en QA
# y en PROD, y cada entorno le dice con quién tiene que hablar.
#
# El nombre va en una variable de nginx, no escrito directo en proxy_pass:
# si va directo, nginx lo resuelve al arrancar y se queda con esa IP.
# Recrear el backend (otro contenedor, otra IP) = 502 hasta reiniciar nginx.
# Con variable + el resolver de Docker (127.0.0.11) resuelve en cada pedido.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api ${BACKEND_URL};

    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
