# nginx del frontend.
#
# Dos trabajos: servir los archivos estáticos del hub, y mandar todo lo que
# empiece con /api al backend. El nombre `backend` lo resuelve el DNS interno
# de la red de compose — por eso no hay ninguna IP acá.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Las librerías vendorizadas no cambian nunca: se cachean fuerte.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # La API va al backend. El nombre va en una VARIABLE, no escrito directo en
    # proxy_pass: si va directo, nginx lo resuelve AL ARRANCAR y se queda con
    # esa IP. Recrear el backend (otro contenedor, otra IP) = 502 hasta
    # reiniciar nginx. Con variable + resolver de Docker (127.0.0.11) resuelve
    # en cada pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:4177;

    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El asistente responde por SSE: sin esto nginx acumula la respuesta y
        # el streaming se ve de golpe al final, o directamente se corta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
